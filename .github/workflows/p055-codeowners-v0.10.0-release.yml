name: P-055 CODEOWNERS Assistant v0.10.0 governed release

on:
  pull_request:
    paths:
      - '.github/workflows/p055-codeowners-v0.10.0-release.yml'
      - 'release/p055-codeowners-v0.10.0.json'
      - 'docs/P055-RELEASE-NOTES-v0.10.0.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/p055-codeowners-v0.10.0-release.yml'
      - 'release/p055-codeowners-v0.10.0.json'
      - 'docs/P055-RELEASE-NOTES-v0.10.0.md'

permissions:
  contents: read

concurrency:
  group: p055-codeowners-v0.10.0-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed release-control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Require exact P-055 source retained and ancestral
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          manifest=json.loads(Path('release/p055-codeowners-v0.10.0.json').read_text())
          source=manifest['source_commit']
          assert source=='0615eaba32c9fe15a95230f61947694341cc4f89'
          assert manifest['roadmap_ids']==['P-055']
          assert manifest['tag']=='v0.10.0'
          assert manifest['roadmap_completion_on_publish'] is False
          subprocess.run(['git','cat-file','-e',f'{source}^{{commit}}'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor',source,os.environ['GITHUB_SHA']],check=True)
          for path in manifest['required_files']:
              subprocess.run(['git','cat-file','-e',f'{source}:{path}'],check=True)
          script=subprocess.check_output(['git','show',f'{source}:scripts/p055_codeowners_assistant.py'],text=True)
          action=subprocess.check_output(['git','show',f'{source}:.github/actions/codeowners-assistant/action.yml'],text=True)
          assert 'VERSION = "0.10.0"' in script
          assert 'P055_LANGUAGE' in action
          assert 'network_request_performed' in script
          print('P055_V0100_EXACT_SOURCE_RETAINED=PASS')
          PY

      - name: Re-run P-055 adversarial tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'pytest>=8,<9'
          python -m pytest -q tests/test_p055_codeowners_assistant.py

      - name: Exercise governed release plan only
        id: release-plan
        uses: ./.github/actions/governed-release
        with:
          manifest: release/p055-codeowners-v0.10.0.json
          publish: 'false'
          evidence-file: p055-v0100-release-plan-evidence.json

      - name: Require non-mutating release plan
        env:
          ACTION_STATUS: ${{ steps.release-plan.outputs.status }}
        run: |
          set -euo pipefail
          test "$ACTION_STATUS" = READY_FOR_TRUSTED_PUSH
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('p055-v0100-release-plan-evidence.json').read_text())
          assert d['mode']=='PLAN_ONLY'
          assert d['published'] is False
          assert d['draft_created'] is False
          assert d['roadmap_completion_promoted'] is False
          print('P055_V0100_RELEASE_PLAN=PASS')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY

      - name: Retain sanitized release-plan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p055-v0100-release-plan-${{ github.run_id }}
          path: |
            governed-release-manifest-validation.json
            p055-v0100-release-plan-evidence.json
          retention-days: 14
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish exact P-055 v0.10.0 source through governed release action
        id: publish
        uses: ./.github/actions/governed-release
        with:
          manifest: release/p055-codeowners-v0.10.0.json
          publish: 'true'
          allowed-ref: refs/heads/main
          evidence-file: p055-v0100-publication-evidence.json

      - name: Independently verify public v0.10.0 release and exact tag target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(python -c "import json;print(json.load(open('release/p055-codeowners-v0.10.0.json'))['tag'])")"
          source_commit="$(python -c "import json;print(json.load(open('release/p055-codeowners-v0.10.0.json'))['source_commit'])")"
          title="$(python -c "import json;print(json.load(open('release/p055-codeowners-v0.10.0.json'))['title'])")"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,name,url,publishedAt > p055-v0100-public-release.json
          python - "$tag" "$source_commit" "$title" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          tag, source, title=sys.argv[1:]
          release=json.loads(Path('p055-v0100-public-release.json').read_text())
          assert release['isDraft'] is False and release['isPrerelease'] is False
          assert release['tagName']==tag and release['name']==title and release['publishedAt']
          remote=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}.git"
          subprocess.run(['git','fetch','--force',remote,f'refs/tags/{tag}:refs/tags/{tag}'],check=True)
          resolved=subprocess.check_output(['git','rev-list','-n','1',tag],text=True).strip()
          assert resolved==source,(resolved,source)
          out={
            'schema_version':'1.0','evidence_type':'p055-v0100-governed-release-publication','roadmap_id':'P-055',
            'tag':tag,'intended_source_commit':source,'resolved_tag_commit':resolved,
            'release_url':release['url'],'published_at':release['publishedAt'],
            'exact_tag_target_verified':True,'roadmap_completion_promoted':False,
            'released_ref_acceptance_required':True,'final_completion_audit_required':True
          }
          Path('p055-v0100-independent-release-verification.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('P055_V0100_GOVERNED_RELEASE=PASS')
          print('P055_V0100_EXACT_PUBLIC_TAG=PASS')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY

      - name: Retain publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p055-v0100-publication-${{ github.run_id }}
          path: |
            governed-release-manifest-validation.json
            p055-v0100-publication-evidence.json
            p055-v0100-public-release.json
            p055-v0100-independent-release-verification.json
          retention-days: 30
          if-no-files-found: error

  released-public-consumer:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout canonical workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout pinned real public consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AntonyMD7/learning-git
          ref: 01723a1825113de08810193f37e8047d978433c2
          path: consumer-learning-git
          persist-credentials: false

      - name: Record consumer input immutability baseline
        run: |
          set -euo pipefail
          test "$(git -C consumer-learning-git rev-parse HEAD)" = '01723a1825113de08810193f37e8047d978433c2'
          sha256sum consumer-learning-git/README.md > /tmp/p055-v0100-consumer-readme-before.sha256
          test "$(git -C consumer-learning-git status --porcelain)" = ''

      - name: Consume released P-055 v0.10.0 Action in English
        id: codeowners-en
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/codeowners-assistant@v0.10.0
        with:
          root: consumer-learning-git
          language: en

      - name: Re-consume released P-055 v0.10.0 Action in English
        id: codeowners-en-again
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/codeowners-assistant@v0.10.0
        with:
          root: consumer-learning-git
          language: en

      - name: Consume released P-055 v0.10.0 Action in Spanish
        id: codeowners-es
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/codeowners-assistant@v0.10.0
        with:
          root: consumer-learning-git
          language: es

      - name: Verify released-ref determinism, localization truth and no mutation
        env:
          STATUS_EN: ${{ steps.codeowners-en.outputs.status }}
          STATUS_ES: ${{ steps.codeowners-es.outputs.status }}
          FINDINGS_EN: ${{ steps.codeowners-en.outputs.finding-count }}
          FINDINGS_ES: ${{ steps.codeowners-es.outputs.finding-count }}
          DIGEST_EN: ${{ steps.codeowners-en.outputs.report-sha256 }}
          DIGEST_EN_2: ${{ steps.codeowners-en-again.outputs.report-sha256 }}
          DIGEST_ES: ${{ steps.codeowners-es.outputs.report-sha256 }}
          REPORT_EN: ${{ steps.codeowners-en.outputs.report-path }}
          REPORT_ES: ${{ steps.codeowners-es.outputs.report-path }}
          GUIDE_EN: ${{ steps.codeowners-en.outputs.guide-path }}
          GUIDE_ES: ${{ steps.codeowners-es.outputs.guide-path }}
        run: |
          set -euo pipefail
          [[ "$STATUS_EN" = CODEOWNERS_MISSING || "$STATUS_EN" = CODEOWNERS_LOCAL_ERRORS || "$STATUS_EN" = CODEOWNERS_NEEDS_REVIEW || "$STATUS_EN" = CODEOWNERS_LOCAL_BASELINE_READY ]]
          test "$STATUS_EN" = "$STATUS_ES"
          test "$FINDINGS_EN" = "$FINDINGS_ES"
          [[ "$DIGEST_EN" =~ ^[0-9a-f]{64}$ ]]
          test "$DIGEST_EN" = "$DIGEST_EN_2"
          test "$DIGEST_EN" = "$DIGEST_ES"
          test "$REPORT_EN" != "$REPORT_ES"
          test "$GUIDE_EN" != "$GUIDE_ES"
          sha256sum --check /tmp/p055-v0100-consumer-readme-before.sha256
          test "$(git -C consumer-learning-git status --porcelain)" = ''
          python - <<'PY'
          import json, os
          from pathlib import Path
          en=json.loads(Path(os.environ['REPORT_EN']).read_text())
          es=json.loads(Path(os.environ['REPORT_ES']).read_text())
          assert en==es
          assert en['roadmap_id']=='P-055'
          assert en['product']['version']=='0.10.0'
          assert en['status']==os.environ['STATUS_EN']
          assert len(en['findings'])==int(os.environ['FINDINGS_EN'])
          assert en['execution']['network_request_performed'] is False
          assert en['execution']['repository_mutation_performed'] is False
          assert en['execution']['repository_code_executed'] is False
          assert en['execution']['subprocess_executed'] is False
          assert en['claims']['github_server_syntax_verified'] is False
          assert en['claims']['owner_identity_or_write_access_verified'] is False
          assert en['claims']['branch_protection_verified'] is False
          assert en['claims']['code_owner_review_requirement_verified'] is False
          assert en['claims']['comprehensive_repository_coverage_proven'] is False
          assert en['claims']['repository_security_guaranteed'] is False
          english=Path(os.environ['GUIDE_EN']).read_text(encoding='utf-8')
          spanish=Path(os.environ['GUIDE_ES']).read_text(encoding='utf-8')
          assert english != spanish
          assert 'credentials' in english.lower()
          evidence={
            'schema_version':'1.0','evidence_type':'p055-v0100-released-ref-public-consumer','roadmap_id':'P-055',
            'release':'v0.10.0','released_source_commit':'0615eaba32c9fe15a95230f61947694341cc4f89',
            'consumer_repository':'AntonyMD7/learning-git','consumer_commit':'01723a1825113de08810193f37e8047d978433c2',
            'status':os.environ['STATUS_EN'],'finding_count':int(os.environ['FINDINGS_EN']),
            'english_report_sha256':os.environ['DIGEST_EN'],'repeat_english_report_sha256':os.environ['DIGEST_EN_2'],
            'spanish_report_sha256':os.environ['DIGEST_ES'],'determinism':'PASS',
            'language_output_paths_isolated':True,'english_spanish_truth_state_consistent':'PASS',
            'consumer_input_mutation_performed':False,'repository_mutation_performed':False,
            'network_request_performed_by_product':False,'repository_code_executed_by_product':False,
            'github_server_syntax_verified':False,'owner_identity_or_write_access_verified':False,
            'branch_protection_verified':False,'code_owner_review_requirement_verified':False,
            'comprehensive_repository_coverage_proven':False,'repository_security_guaranteed':False,
            'roadmap_completion_promoted':False
          }
          Path('p055-v0100-released-ref-consumer.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print('P055_V0100_RELEASED_REF_CONSUMER=PASS')
          print('P055_V0100_DETERMINISM=PASS')
          print('P055_V0100_EN_ES_TRUTH_STATE=PASS')
          print('P055_V0100_CONSUMER_INPUT_MUTATION=NO')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY

      - name: Retain sanitized released-ref evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p055-v0100-released-ref-consumer-${{ github.run_id }}
          path: p055-v0100-released-ref-consumer.json
          retention-days: 30
          if-no-files-found: error
