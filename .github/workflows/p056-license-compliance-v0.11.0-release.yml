name: P-056 License Compliance Checker v0.11.0 governed release

on:
  pull_request:
    paths:
      - '.github/workflows/p056-license-compliance-v0.11.0-release.yml'
      - 'release/p056-license-compliance-v0.11.0.json'
      - 'docs/P056-RELEASE-NOTES-v0.11.0.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/p056-license-compliance-v0.11.0-release.yml'
      - 'release/p056-license-compliance-v0.11.0.json'
      - 'docs/P056-RELEASE-NOTES-v0.11.0.md'

permissions:
  contents: read
  actions: read

concurrency:
  group: p056-license-compliance-v0.11.0-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed release-control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Require exact P-056 product source retained and ancestral
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          manifest=json.loads(Path('release/p056-license-compliance-v0.11.0.json').read_text())
          source=manifest['source_commit']
          assert source=='7678c883cb030ede3e291748c77f461413022380'
          assert manifest['roadmap_ids']==['P-056']
          assert manifest['tag']=='v0.11.0'
          assert manifest['roadmap_completion_on_publish'] is False
          subprocess.run(['git','cat-file','-e',f'{source}^{{commit}}'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor',source,os.environ['GITHUB_SHA']],check=True)
          for path in manifest['required_files']:
              subprocess.run(['git','cat-file','-e',f'{source}:{path}'],check=True)
          script=subprocess.check_output(['git','show',f'{source}:scripts/p056_license_compliance.py'],text=True)
          action=subprocess.check_output(['git','show',f'{source}:.github/actions/license-compliance/action.yml'],text=True)
          assert 'VERSION = "0.11.0"' in script
          assert 'EXPECTED_REUSE_VERSION = "6.2.0"' in script
          assert '[str(reuse_bin), "lint", "--json"]' in script
          assert 'reuse==${P056_REUSE_VERSION}' in action
          assert 'full_transitive_dependency_hash_lock_claimed' in script
          print('P056_V0110_EXACT_SOURCE_RETAINED=PASS')
          print('P056_V0110_RELEASE_DOES_NOT_PROMOTE_COMPLETION=PASS')
          PY

      - name: Re-run P-056 adversarial tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'pytest>=8,<9'
          python -m pytest -q tests/test_p056_license_compliance.py

      - name: Re-verify retained source-acceptance run and artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31944118421" > p056-source-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31944118421/artifacts" > p056-source-artifacts.json
          python - <<'PY'
          import json
          from pathlib import Path
          run=json.loads(Path('p056-source-run.json').read_text())
          assert run['conclusion']=='success'
          assert run['head_sha']=='fc3a22a98d431401ab8386fafd943298ee5240df'
          artifacts=json.loads(Path('p056-source-artifacts.json').read_text())['artifacts']
          found={a['name']:(str(a['id']),a.get('digest')) for a in artifacts}
          expected=('9262815302','sha256:74e4ac6e5ef192514b58b885418f75de17fc783cbbd1fb8f694ffd6097e86390')
          assert found.get('p056-source-acceptance-31944118421')==expected
          print('P056_SOURCE_ACCEPTANCE_EVIDENCE=PASS')
          PY

      - name: Exercise governed release plan only
        id: release-plan
        uses: ./.github/actions/governed-release
        with:
          manifest: release/p056-license-compliance-v0.11.0.json
          publish: 'false'
          evidence-file: p056-v0110-release-plan-evidence.json

      - name: Require non-mutating release plan
        env:
          ACTION_STATUS: ${{ steps.release-plan.outputs.status }}
        run: |
          set -euo pipefail
          test "$ACTION_STATUS" = READY_FOR_TRUSTED_PUSH
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('p056-v0110-release-plan-evidence.json').read_text())
          assert d['mode']=='PLAN_ONLY'
          assert d['published'] is False
          assert d['draft_created'] is False
          assert d['roadmap_completion_promoted'] is False
          print('P056_V0110_RELEASE_PLAN=PASS')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY

      - name: Retain sanitized release-plan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p056-v0110-release-plan-${{ github.run_id }}
          path: |
            governed-release-manifest-validation.json
            p056-v0110-release-plan-evidence.json
            p056-source-run.json
            p056-source-artifacts.json
          retention-days: 14
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish exact P-056 v0.11.0 source through governed release action
        id: publish
        uses: ./.github/actions/governed-release
        with:
          manifest: release/p056-license-compliance-v0.11.0.json
          publish: 'true'
          allowed-ref: refs/heads/main
          evidence-file: p056-v0110-publication-evidence.json

      - name: Independently verify public v0.11.0 release and exact tag target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(python -c "import json;print(json.load(open('release/p056-license-compliance-v0.11.0.json'))['tag'])")"
          source_commit="$(python -c "import json;print(json.load(open('release/p056-license-compliance-v0.11.0.json'))['source_commit'])")"
          title="$(python -c "import json;print(json.load(open('release/p056-license-compliance-v0.11.0.json'))['title'])")"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,name,url,publishedAt > p056-v0110-public-release.json
          python - "$tag" "$source_commit" "$title" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          tag, source, title=sys.argv[1:]
          release=json.loads(Path('p056-v0110-public-release.json').read_text())
          assert release['isDraft'] is False and release['isPrerelease'] is False
          assert release['tagName']==tag and release['name']==title and release['publishedAt']
          remote=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}.git"
          subprocess.run(['git','fetch','--force',remote,f'refs/tags/{tag}:refs/tags/{tag}'],check=True)
          resolved=subprocess.check_output(['git','rev-list','-n','1',tag],text=True).strip()
          assert resolved==source,(resolved,source)
          out={
            'schema_version':'1.0','evidence_type':'p056-v0110-governed-release-publication','roadmap_id':'P-056',
            'tag':tag,'intended_source_commit':source,'resolved_tag_commit':resolved,
            'release_url':release['url'],'published_at':release['publishedAt'],
            'exact_tag_target_verified':True,'roadmap_completion_promoted':False,
            'released_ref_acceptance_required':True,'final_completion_audit_required':True
          }
          Path('p056-v0110-independent-release-verification.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('P056_V0110_GOVERNED_RELEASE=PASS')
          print('P056_V0110_EXACT_PUBLIC_TAG=PASS')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY

      - name: Retain publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p056-v0110-publication-${{ github.run_id }}
          path: |
            governed-release-manifest-validation.json
            p056-v0110-publication-evidence.json
            p056-v0110-public-release.json
            p056-v0110-independent-release-verification.json
          retention-days: 30
          if-no-files-found: error

  released-public-consumer:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout canonical workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout pinned real public consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AntonyMD7/learning-git
          ref: 01723a1825113de08810193f37e8047d978433c2
          path: consumer-learning-git
          persist-credentials: false

      - name: Record consumer input immutability baseline
        run: |
          set -euo pipefail
          test "$(git -C consumer-learning-git rev-parse HEAD)" = '01723a1825113de08810193f37e8047d978433c2'
          sha256sum consumer-learning-git/README.md > /tmp/p056-v0110-consumer-readme-before.sha256
          test "$(git -C consumer-learning-git status --porcelain)" = ''

      - name: Consume released P-056 v0.11.0 in English
        id: license-en
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/license-compliance@v0.11.0
        with:
          root: consumer-learning-git
          language: en
          source-revision: 01723a1825113de08810193f37e8047d978433c2

      - name: Re-consume released P-056 v0.11.0 in English
        id: license-en-again
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/license-compliance@v0.11.0
        with:
          root: consumer-learning-git
          language: en
          source-revision: 01723a1825113de08810193f37e8047d978433c2

      - name: Consume released P-056 v0.11.0 in Spanish
        id: license-es
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/license-compliance@v0.11.0
        with:
          root: consumer-learning-git
          language: es
          source-revision: 01723a1825113de08810193f37e8047d978433c2

      - name: Verify released-ref determinism, localization truth, privacy and no mutation
        env:
          STATUS_EN: ${{ steps.license-en.outputs.status }}
          STATUS_ES: ${{ steps.license-es.outputs.status }}
          COMPLIANT_EN: ${{ steps.license-en.outputs.compliant }}
          COMPLIANT_ES: ${{ steps.license-es.outputs.compliant }}
          TOOL_EN: ${{ steps.license-en.outputs.reuse-tool-version }}
          SPEC_EN: ${{ steps.license-en.outputs.reuse-spec-version }}
          DEP_EN: ${{ steps.license-en.outputs.dependency-environment-sha256 }}
          DEP_EN_2: ${{ steps.license-en-again.outputs.dependency-environment-sha256 }}
          DEP_ES: ${{ steps.license-es.outputs.dependency-environment-sha256 }}
          DIGEST_EN: ${{ steps.license-en.outputs.report-sha256 }}
          DIGEST_EN_2: ${{ steps.license-en-again.outputs.report-sha256 }}
          DIGEST_ES: ${{ steps.license-es.outputs.report-sha256 }}
          REPORT_EN: ${{ steps.license-en.outputs.report-path }}
          REPORT_ES: ${{ steps.license-es.outputs.report-path }}
          GUIDE_EN: ${{ steps.license-en.outputs.guide-path }}
          GUIDE_ES: ${{ steps.license-es.outputs.guide-path }}
        run: |
          set -euo pipefail
          test "$STATUS_EN" = 'REUSE_NONCOMPLIANT'
          test "$STATUS_EN" = "$STATUS_ES"
          test "$COMPLIANT_EN" = 'false'
          test "$COMPLIANT_EN" = "$COMPLIANT_ES"
          test "$TOOL_EN" = '6.2.0'
          test "$SPEC_EN" = '3.3'
          test "$DEP_EN" = "$DEP_EN_2"
          test "$DEP_EN" = "$DEP_ES"
          [[ "$DIGEST_EN" =~ ^[0-9a-f]{64}$ ]]
          test "$DIGEST_EN" = "$DIGEST_EN_2"
          test "$DIGEST_EN" = "$DIGEST_ES"
          test "$REPORT_EN" != "$REPORT_ES"
          test "$GUIDE_EN" != "$GUIDE_ES"
          sha256sum --check /tmp/p056-v0110-consumer-readme-before.sha256
          test "$(git -C consumer-learning-git status --porcelain)" = ''
          python - <<'PY'
          import json, os
          from pathlib import Path
          en=json.loads(Path(os.environ['REPORT_EN']).read_text())
          es=json.loads(Path(os.environ['REPORT_ES']).read_text())
          assert en==es
          assert en['roadmap_id']=='P-056'
          assert en['product']['version']=='0.11.0'
          assert en['source']['revision']=='01723a1825113de08810193f37e8047d978433c2'
          assert en['status']=='REUSE_NONCOMPLIANT'
          assert en['summary']['compliant'] is False
          assert en['execution']['repository_mutation_performed'] is False
          assert en['execution']['audit_network_request_performed'] is False
          assert en['claims']['legal_permission_established'] is False
          assert en['claims']['license_compatibility_established'] is False
          assert en['claims']['dependency_license_safety_established'] is False
          assert en['claims']['distribution_legally_approved'] is False
          assert Path(os.environ['GUIDE_EN']).read_text() != Path(os.environ['GUIDE_ES']).read_text()
          assert 'README.md' not in json.dumps(en)
          evidence={
            'schema_version':'1.0','evidence_type':'p056-v0110-released-ref-public-consumer','roadmap_id':'P-056',
            'release':'v0.11.0','released_source_commit':'7678c883cb030ede3e291748c77f461413022380',
            'consumer_repository':'AntonyMD7/learning-git','consumer_commit':'01723a1825113de08810193f37e8047d978433c2',
            'status':os.environ['STATUS_EN'],'compliant':False,
            'reuse_tool_version':os.environ['TOOL_EN'],'reuse_spec_version':os.environ['SPEC_EN'],
            'dependency_environment_sha256':os.environ['DEP_EN'],
            'english_report_sha256':os.environ['DIGEST_EN'],'repeat_english_report_sha256':os.environ['DIGEST_EN_2'],
            'spanish_report_sha256':os.environ['DIGEST_ES'],'determinism':'PASS',
            'language_truth_state_consistent':'PASS','consumer_input_mutation_performed':False,
            'repository_mutation_performed':False,'audit_network_request_performed':False,
            'legal_permission_claimed':False,'license_compatibility_claimed':False,
            'dependency_license_safety_claimed':False,'roadmap_completion_promoted':False
          }
          Path('p056-v0110-released-ref-consumer.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          Path('p056-v0110-public-report.json').write_text(json.dumps(en,indent=2,sort_keys=True)+'\n')
          Path('p056-v0110-guide-en.md').write_text(Path(os.environ['GUIDE_EN']).read_text())
          Path('p056-v0110-guide-es.md').write_text(Path(os.environ['GUIDE_ES']).read_text())
          print('P056_V0110_RELEASED_REF_CONSUMER=PASS')
          print('P056_V0110_DETERMINISM=PASS')
          print('P056_V0110_EN_ES_TRUTH_STATE=PASS')
          print('P056_V0110_CONSUMER_INPUT_MUTATION=NO')
          print('P056_V0110_RAW_REPORT_RETAINED=NO')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY

      - name: Retain sanitized released-ref evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p056-v0110-released-ref-consumer-${{ github.run_id }}
          path: |
            p056-v0110-released-ref-consumer.json
            p056-v0110-public-report.json
            p056-v0110-guide-en.md
            p056-v0110-guide-es.md
          retention-days: 30
          if-no-files-found: error
