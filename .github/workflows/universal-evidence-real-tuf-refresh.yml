name: Universal Evidence real TUF refresh acceptance

on:
  push:
    paths:
      - 'scripts/tuf_refresh_acceptance.py'
      - 'tests/test_tuf_refresh_acceptance.py'
      - 'docs/UNIVERSAL-EVIDENCE-TUF-REFRESH-ACCEPTANCE.md'
      - '.github/workflows/universal-evidence-real-tuf-refresh.yml'
  pull_request:
    paths:
      - 'scripts/tuf_refresh_acceptance.py'
      - 'tests/test_tuf_refresh_acceptance.py'
      - 'docs/UNIVERSAL-EVIDENCE-TUF-REFRESH-ACCEPTANCE.md'
      - '.github/workflows/universal-evidence-real-tuf-refresh.yml'

permissions:
  contents: read

jobs:
  authenticated-tuf-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned upstream TUF client and test dependencies
        run: python -m pip install --disable-pip-version-check 'tuf==7.0.0' 'pytest>=8,<9'

      - name: Compile and run local contract tests
        run: |
          python -m compileall -q scripts/tuf_refresh_acceptance.py tests/test_tuf_refresh_acceptance.py
          python -m pytest -q tests/test_tuf_refresh_acceptance.py

      - name: Acquire immutable Sigstore root-5 bootstrap object
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --show-error \
            --location \
            --retry 3 \
            --output /tmp/sigstore-5.root.json \
            'https://raw.githubusercontent.com/sigstore/root-signing/54c142857637d12732de93a71adaadd0e561c749/metadata/root_history/5.root.json'

      - name: Run python-tuf authenticated root-chain and target acceptance
        shell: bash
        run: |
          set -euo pipefail
          metadata_dir="$(mktemp -d)"
          target_dir="$(mktemp -d)"
          trap 'rm -rf "$metadata_dir" "$target_dir"' EXIT
          python scripts/tuf_refresh_acceptance.py \
            --bootstrap-root /tmp/sigstore-5.root.json \
            --metadata-dir "$metadata_dir" \
            --target-dir "$target_dir" \
            --expected-git-blob-sha1 38f80f940473ac167abae3db9bc6a94d0bdb8c4e \
            --expected-root-version 5 \
            --output /tmp/tuf-refresh-evidence.json \
            > /tmp/tuf-refresh-result.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/tuf-refresh-evidence.json').read_text(encoding='utf-8'))
          assert data['tooling']['client'] == 'python-tuf'
          assert data['tooling']['client_version'] == '7.0.0'
          assert data['bootstrap']['root_version'] == 5
          assert data['bootstrap']['git_blob_sha1'] == '38f80f940473ac167abae3db9bc6a94d0bdb8c4e'
          assert data['refresh']['refreshed_root_version'] > 5
          assert data['refresh']['authenticated_root_chain_advanced'] is True
          assert data['refresh']['top_level_refresh_succeeded'] is True
          assert data['verified_target']['download_verified_by_tuf_metadata'] is True
          assert data['scope']['user_device_mutation_performed'] is False
          assert data['scope']['production_mutation_performed'] is False
          assert all(value is False for value in data['claims'].values())
          print('PYTHON_TUF_AUTHENTICATED_REFRESH=PASS')
          print('ROOT_CHAIN_ADVANCED=TRUE')
          print('TRUSTED_ROOT_TARGET_VERIFIED=TRUE')
          print('ROADMAP_COMPLETION_CLAIMED=FALSE')
          PY

      - name: Verify same public TUF repository with GitHub CLI toolchain
        shell: bash
        run: |
          set -euo pipefail
          gh --version | head -1 | tee /tmp/gh-version.txt
          gh attestation trusted-root \
            --tuf-url 'https://tuf-repo-cdn.sigstore.dev' \
            --tuf-root /tmp/sigstore-5.root.json \
            --verify-only
          printf '%s\n' 'GH_TUF_VERIFY_ONLY=PASS'
          printf '%s\n' 'INDEPENDENT_SECURITY_AUDIT_CLAIMED=FALSE'

      - name: Upload sanitized TUF refresh evidence
        uses: actions/upload-artifact@v4
        with:
          name: universal-evidence-tuf-refresh-supporting-acceptance
          path: |
            /tmp/tuf-refresh-evidence.json
            /tmp/gh-version.txt
          if-no-files-found: error
          retention-days: 14
