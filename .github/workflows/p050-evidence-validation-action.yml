name: P-050 Evidence Validation Action acceptance

on:
  pull_request:
    paths:
      - 'scripts/evidence_validate.py'
      - 'schemas/universal-evidence-v0.1.schema.json'
      - 'examples/universal-evidence-*.json'
      - 'tests/test_evidence_validate.py'
      - '.github/actions/evidence-validate/**'
      - '.github/workflows/p050-evidence-validation-action.yml'
      - 'docs/EVIDENCE-VALIDATION-ACTION.md'
  push:
    branches: [main]
    paths:
      - 'scripts/evidence_validate.py'
      - 'schemas/universal-evidence-v0.1.schema.json'
      - 'examples/universal-evidence-*.json'
      - 'tests/test_evidence_validate.py'
      - '.github/actions/evidence-validate/**'
      - '.github/workflows/p050-evidence-validation-action.yml'
      - 'docs/EVIDENCE-VALIDATION-ACTION.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.26.0' 'pytest>=8,<9'

      - name: Compile and run adversarial unit tests
        run: |
          python -m compileall -q scripts tests
          python -m pytest -q tests/test_evidence_validate.py

      - name: Build exact-hash acceptance fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p050-artifacts"
          printf 'P-050 public acceptance fixture\n' > "$RUNNER_TEMP/p050-artifacts/result.txt"
          python - "$RUNNER_TEMP/p050-artifacts/result.txt" "$RUNNER_TEMP/p050-valid.json" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          artifact = Path(sys.argv[1])
          output = Path(sys.argv[2])
          record = json.loads(Path('examples/universal-evidence-readonly-example.json').read_text(encoding='utf-8'))
          record['artifacts'] = [{
              'name': 'result.txt',
              'sha256': hashlib.sha256(artifact.read_bytes()).hexdigest(),
              'media_type': 'text/plain',
          }]
          output.write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Exercise reusable action with real artifact hash
        id: positive
        uses: ./.github/actions/evidence-validate
        with:
          evidence: ${{ runner.temp }}/p050-valid.json
          artifact-root: ${{ runner.temp }}/p050-artifacts
          max-artifacts: '8'
          max-artifact-bytes: '1048576'

      - name: Assert machine-readable outputs
        shell: bash
        env:
          STATUS: ${{ steps.positive.outputs.status }}
          SCHEMA_ERRORS: ${{ steps.positive.outputs.schema-error-count }}
          ARTIFACT_FAILURES: ${{ steps.positive.outputs.artifact-failure-count }}
          VERIFIED: ${{ steps.positive.outputs.verified-artifact-count }}
          REPORT_SHA: ${{ steps.positive.outputs.report-sha256 }}
        run: |
          set -euo pipefail
          test "$STATUS" = PASS
          test "$SCHEMA_ERRORS" = 0
          test "$ARTIFACT_FAILURES" = 0
          test "$VERIFIED" = 1
          printf '%s' "$REPORT_SHA" | grep -Eq '^[0-9a-f]{64}$'
          echo 'P050_POSITIVE_ACTION_ACCEPTANCE=PASS'

      - name: Build traversal negative control
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/p050-negative.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          record = json.loads(Path('examples/universal-evidence-readonly-example.json').read_text(encoding='utf-8'))
          record['artifacts'] = [{'name': '../escape.txt', 'sha256': '0' * 64, 'media_type': 'text/plain'}]
          Path(sys.argv[1]).write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Require reusable action to fail closed on traversal
        id: negative
        continue-on-error: true
        uses: ./.github/actions/evidence-validate
        with:
          evidence: ${{ runner.temp }}/p050-negative.json
          artifact-root: ${{ runner.temp }}/p050-artifacts

      - name: Assert negative control failed
        shell: bash
        env:
          OUTCOME: ${{ steps.negative.outcome }}
          STATUS: ${{ steps.negative.outputs.status }}
          FAILURES: ${{ steps.negative.outputs.artifact-failure-count }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          test "$STATUS" = FAIL
          test "$FAILURES" -ge 1
          echo 'P050_TRAVERSAL_NEGATIVE_CONTROL=PASS'
          echo 'CLAIMED_EVENT_PROVEN=FALSE'
          echo 'PRODUCER_IDENTITY_VERIFIED=FALSE'
          echo 'ROADMAP_COMPLETION_CLAIMED=FALSE'

  attestation-interop:
    name: GitHub signed-attestation interoperability
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up exact supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Create a real validator report through P-050
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p050-attest-artifacts"
          printf 'P-050 attestation interoperability fixture\n' > "$RUNNER_TEMP/p050-attest-artifacts/result.txt"
          python - "$RUNNER_TEMP/p050-attest-artifacts/result.txt" "$RUNNER_TEMP/p050-attest-evidence.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          artifact = Path(sys.argv[1])
          record = json.loads(Path('examples/universal-evidence-readonly-example.json').read_text(encoding='utf-8'))
          record['evidence_id'] = 'p050-attestation-interoperability'
          record['artifacts'] = [{
              'name': 'result.txt',
              'sha256': hashlib.sha256(artifact.read_bytes()).hexdigest(),
              'media_type': 'text/plain',
          }]
          Path(sys.argv[2]).write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Validate before signing provenance
        id: validate
        uses: ./.github/actions/evidence-validate
        with:
          evidence: ${{ runner.temp }}/p050-attest-evidence.json
          artifact-root: ${{ runner.temp }}/p050-attest-artifacts
          max-artifacts: '8'
          max-artifact-bytes: '1048576'

      - name: Materialize exact validated report in workspace
        env:
          REPORT: ${{ steps.validate.outputs.report-path }}
          REPORT_SHA: ${{ steps.validate.outputs.report-sha256 }}
        run: |
          set -euo pipefail
          test "${{ steps.validate.outputs.status }}" = PASS
          cp "$REPORT" p050-validation-report.json
          printf '%s  %s\n' "$REPORT_SHA" p050-validation-report.json | sha256sum -c -

      - name: Attest exact P-050 validation report
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: p050-validation-report.json
          create-storage-record: false

      - name: Cryptographically verify exact local attestation bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "$BUNDLE"
          test -s "$BUNDLE"
          signer="$GITHUB_REPOSITORY/.github/workflows/p050-evidence-validation-action.yml"
          gh attestation verify p050-validation-report.json \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$BUNDLE" \
            --signer-workflow "$signer" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --format json > p050-attestation-local-verification.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('p050-attestation-local-verification.json').read_text(encoding='utf-8'))
          assert isinstance(data, list) and data, data
          for item in data:
              vr = item.get('verificationResult') or {}
              sig = vr.get('signature') or {}
              assert sig.get('certificate'), item
              assert vr.get('verifiedTimestamps'), item
          print('P050_LOCAL_BUNDLE_CRYPTO_VERIFY=PASS')
          PY

      - name: Verify repository-attestation retrieval with bounded propagation retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          signer="$GITHUB_REPOSITORY/.github/workflows/p050-evidence-validation-action.yml"
          success=0
          : > p050-attestation-api-errors.txt
          for delay in 0 2 4 8 12 16; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            if gh attestation verify p050-validation-report.json \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --format json > p050-attestation-repository-verification.json 2>>p050-attestation-api-errors.txt; then
              success=1
              break
            fi
          done
          test "$success" = 1
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('p050-attestation-repository-verification.json').read_text(encoding='utf-8'))
          assert isinstance(data, list) and data, data
          for item in data:
              vr = item.get('verificationResult') or {}
              assert (vr.get('signature') or {}).get('certificate'), item
              assert vr.get('verifiedTimestamps'), item
          print('P050_GITHUB_ATTESTATION_REPOSITORY_RETRIEVAL=PASS')
          print('SCHEMA_HASH_VALIDATION_EQUALS_PRODUCER_AUTHENTICATION=FALSE')
          print('ROADMAP_COMPLETION_CLAIMED=FALSE')
          PY

      - name: Retain sanitized interoperability evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p050-attestation-interop-${{ github.run_id }}
          path: |
            p050-validation-report.json
            p050-attestation-local-verification.json
            p050-attestation-repository-verification.json
            p050-attestation-api-errors.txt
          retention-days: 30
          if-no-files-found: error
