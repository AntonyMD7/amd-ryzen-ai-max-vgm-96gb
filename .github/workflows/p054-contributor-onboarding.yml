name: P-054 Contributor Onboarding Assistant acceptance

on:
  pull_request:
    paths:
      - 'scripts/p054_contributor_onboarding.py'
      - 'tests/test_p054_contributor_onboarding.py'
      - '.github/actions/contributor-onboarding/**'
      - '.github/workflows/p054-contributor-onboarding.yml'
      - 'docs/P054-CONTRIBUTOR-ONBOARDING*'
      - '.github/ISSUE_TEMPLATE/p054-contributor-onboarding.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/p054_contributor_onboarding.py'
      - 'tests/test_p054_contributor_onboarding.py'
      - '.github/actions/contributor-onboarding/**'
      - '.github/workflows/p054-contributor-onboarding.yml'
      - 'docs/P054-CONTRIBUTOR-ONBOARDING*'
      - '.github/ISSUE_TEMPLATE/p054-contributor-onboarding.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run adversarial P-054 tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'pytest>=8,<9'
          python -m pytest -q tests/test_p054_contributor_onboarding.py
      - name: Build ready fixture and require stable EN/ES evidence
        run: |
          set -euo pipefail
          fixture="${RUNNER_TEMP}/p054-ready-fixture"
          mkdir -p "$fixture/.github/ISSUE_TEMPLATE"
          for f in README.md CONTRIBUTING.md SECURITY.md LICENSE CODE_OF_CONDUCT.md SUPPORT.md START-HERE.md; do printf '# fixture\n' > "$fixture/$f"; done
          printf '# pull request\n' > "$fixture/.github/PULL_REQUEST_TEMPLATE.md"
          printf 'name: Fixture\ndescription: Fixture only\nbody: []\n' > "$fixture/.github/ISSUE_TEMPLATE/fixture.yml"
          python scripts/p054_contributor_onboarding.py --root "$fixture" --language en --out-dir "${RUNNER_TEMP}/p054-en" > /tmp/p054-en-result.json
          python scripts/p054_contributor_onboarding.py --root "$fixture" --language es --out-dir "${RUNNER_TEMP}/p054-es" > /tmp/p054-es-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          en=json.loads(Path('/tmp/p054-en-result.json').read_text())
          es=json.loads(Path('/tmp/p054-es-result.json').read_text())
          assert en['status']=='ONBOARDING_BASELINE_READY'
          assert es['status']=='ONBOARDING_BASELINE_READY'
          assert en['missing_required_count']==0==es['missing_required_count']
          print('P054_READY_FIXTURE_EN_ES=PASS')
          PY

  real-public-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout P-054 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: product
          persist-credentials: false
      - name: Checkout pinned real public consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AntonyMD7/learning-git
          ref: 01723a1825113de08810193f37e8047d978433c2
          path: consumer
          persist-credentials: false
      - name: Record consumer immutability baseline
        run: |
          set -euo pipefail
          test "$(git -C consumer rev-parse HEAD)" = '01723a1825113de08810193f37e8047d978433c2'
          sha256sum consumer/README.md > /tmp/p054-learning-before.sha256
          test "$(git -C consumer status --porcelain)" = ''
      - name: Run P-054 Action in English
        id: onboarding-en
        uses: ./product/.github/actions/contributor-onboarding
        with:
          root: consumer
          language: en
      - name: Repeat P-054 Action in English
        id: onboarding-en-again
        uses: ./product/.github/actions/contributor-onboarding
        with:
          root: consumer
          language: en
      - name: Run P-054 Action in Spanish in the same job
        id: onboarding-es
        uses: ./product/.github/actions/contributor-onboarding
        with:
          root: consumer
          language: es
      - name: Verify isolated language outputs and read-only truth state
        env:
          STATUS_EN: ${{ steps.onboarding-en.outputs.status }}
          STATUS_ES: ${{ steps.onboarding-es.outputs.status }}
          MISSING_EN: ${{ steps.onboarding-en.outputs.missing-required-count }}
          MISSING_ES: ${{ steps.onboarding-es.outputs.missing-required-count }}
          DIGEST_EN: ${{ steps.onboarding-en.outputs.report-sha256 }}
          DIGEST_EN_2: ${{ steps.onboarding-en-again.outputs.report-sha256 }}
          REPORT_EN: ${{ steps.onboarding-en.outputs.report-path }}
          REPORT_ES: ${{ steps.onboarding-es.outputs.report-path }}
          GUIDE_EN: ${{ steps.onboarding-en.outputs.guide-path }}
          GUIDE_ES: ${{ steps.onboarding-es.outputs.guide-path }}
        run: |
          set -euo pipefail
          test "$STATUS_EN" = "$STATUS_ES"
          test "$MISSING_EN" = "$MISSING_ES"
          test "$DIGEST_EN" = "$DIGEST_EN_2"
          test "$REPORT_EN" != "$REPORT_ES"
          test "$GUIDE_EN" != "$GUIDE_ES"
          sha256sum --check /tmp/p054-learning-before.sha256
          test "$(git -C consumer status --porcelain)" = ''
          python - <<'PY'
          import json, os
          from pathlib import Path
          en=json.loads(Path(os.environ['REPORT_EN']).read_text())
          es=json.loads(Path(os.environ['REPORT_ES']).read_text())
          assert en['language']=='en' and es['language']=='es'
          assert en['status']==es['status']
          assert en['missing_required']==es['missing_required']
          assert en['execution']==es['execution']
          assert en['claims']==es['claims']
          assert en['execution']['network_request_performed'] is False
          assert en['execution']['repository_mutation_performed'] is False
          assert en['execution']['repository_code_executed'] is False
          eng=Path(os.environ['GUIDE_EN']).read_text(encoding='utf-8')
          spa=Path(os.environ['GUIDE_ES']).read_text(encoding='utf-8')
          assert eng != spa
          assert 'credentials' in eng.lower()
          evidence={
            'schema_version':'1.0','evidence_type':'p054-source-real-public-readonly','roadmap_id':'P-054',
            'consumer_repository':'AntonyMD7/learning-git','consumer_commit':'01723a1825113de08810193f37e8047d978433c2',
            'status':os.environ['STATUS_EN'],'english_report_sha256':os.environ['DIGEST_EN'],
            'repeat_english_report_sha256':os.environ['DIGEST_EN_2'],
            'language_output_paths_isolated':True,'english_spanish_truth_state_consistent':'PASS',
            'consumer_input_mutation_performed':False,'network_request_performed_by_product':False,
            'repository_code_executed_by_product':False,'github_community_profile_verified':False,
            'roadmap_completion_promoted':False
          }
          Path('product/p054-source-real-public-evidence.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print('P054_MULTILANGUAGE_OUTPUT_ISOLATION=PASS')
          print('P054_REAL_PUBLIC_READONLY=PASS')
          print('P054_INPUT_MUTATION=NO')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY
      - name: Upload sanitized P-054 source acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p054-source-real-public-${{ github.run_id }}
          path: product/p054-source-real-public-evidence.json
          retention-days: 14
          if-no-files-found: error
