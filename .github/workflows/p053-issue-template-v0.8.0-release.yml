name: P-053 Issue Template Generator v0.8.0 governed release

on:
  pull_request:
    paths:
      - '.github/workflows/p053-issue-template-v0.8.0-release.yml'
      - 'release/p053-issue-template-v0.8.0.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/p053-issue-template-v0.8.0-release.yml'
      - 'release/p053-issue-template-v0.8.0.json'

permissions:
  contents: read

concurrency:
  group: p053-issue-template-v0.8.0-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed release-control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Require exact P-053 product source retained and ancestral
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          manifest=json.loads(Path('release/p053-issue-template-v0.8.0.json').read_text())
          source=manifest['source_commit']
          subprocess.run(['git','cat-file','-e',f'{source}^{{commit}}'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor',source,os.environ['GITHUB_SHA']],check=True)
          for path in manifest['required_files']:
              subprocess.run(['git','cat-file','-e',f'{source}:{path}'],check=True)
          assert manifest['roadmap_ids']==['P-053']
          assert manifest['tag']=='v0.8.0'
          assert manifest['roadmap_completion_on_publish'] is False
          print('P053_EXACT_PRODUCT_SOURCE_RETAINED=PASS')
          PY

      - name: Re-run P-053 adversarial product tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'pytest>=8,<9' 'PyYAML>=6,<7'
          python -m pytest -q tests/test_p053_issue_template_generator.py

      - name: Exercise governed release plan only
        id: release-plan
        uses: ./.github/actions/governed-release
        with:
          manifest: release/p053-issue-template-v0.8.0.json
          publish: 'false'
          evidence-file: p053-release-plan-evidence.json

      - name: Require non-mutating release plan
        env:
          ACTION_STATUS: ${{ steps.release-plan.outputs.status }}
        run: |
          set -euo pipefail
          test "$ACTION_STATUS" = READY_FOR_TRUSTED_PUSH
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('p053-release-plan-evidence.json').read_text())
          assert d['mode']=='PLAN_ONLY'
          assert d['published'] is False
          assert d['draft_created'] is False
          assert d['roadmap_completion_promoted'] is False
          print('P053_RELEASE_PLAN=PASS')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY

      - name: Retain sanitized release-plan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p053-release-plan-${{ github.run_id }}
          path: |
            governed-release-manifest-validation.json
            p053-release-plan-evidence.json
          retention-days: 14
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish exact P-053 source through governed release action
        id: publish
        uses: ./.github/actions/governed-release
        with:
          manifest: release/p053-issue-template-v0.8.0.json
          publish: 'true'
          allowed-ref: refs/heads/main
          evidence-file: p053-publication-evidence.json

      - name: Independently verify public release and exact tag target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(python -c "import json;print(json.load(open('release/p053-issue-template-v0.8.0.json'))['tag'])")"
          source_commit="$(python -c "import json;print(json.load(open('release/p053-issue-template-v0.8.0.json'))['source_commit'])")"
          title="$(python -c "import json;print(json.load(open('release/p053-issue-template-v0.8.0.json'))['title'])")"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,name,url,publishedAt > p053-public-release.json
          python - "$tag" "$source_commit" "$title" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          tag, source, title=sys.argv[1:]
          release=json.loads(Path('p053-public-release.json').read_text())
          assert release['isDraft'] is False and release['isPrerelease'] is False
          assert release['tagName']==tag
          assert release['name']==title
          assert release['publishedAt']
          remote=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}.git"
          subprocess.run(['git','fetch','--force',remote,f'refs/tags/{tag}:refs/tags/{tag}'],check=True)
          resolved=subprocess.check_output(['git','rev-list','-n','1',tag],text=True).strip()
          assert resolved==source,(resolved,source)
          out={
            'schema_version':'1.0','evidence_type':'p053-governed-release-publication','roadmap_id':'P-053',
            'tag':tag,'intended_source_commit':source,'resolved_tag_commit':resolved,
            'release_url':release['url'],'published_at':release['publishedAt'],
            'exact_tag_target_verified':True,'roadmap_completion_promoted':False,
            'released_ref_acceptance_required':True,'final_completion_audit_required':True
          }
          Path('p053-independent-release-verification.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('P053_GOVERNED_RELEASE=PASS')
          print('P053_EXACT_PUBLIC_TAG=PASS')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY

      - name: Retain publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p053-publication-${{ github.run_id }}
          path: |
            governed-release-manifest-validation.json
            p053-publication-evidence.json
            p053-public-release.json
            p053-independent-release-verification.json
          retention-days: 30
          if-no-files-found: error

  released-public-consumer:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout canonical workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout pinned real public consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AntonyMD7/learning-git
          ref: 01723a1825113de08810193f37e8047d978433c2
          path: consumer-learning-git
          persist-credentials: false

      - name: Record consumer input immutability baseline
        run: |
          set -euo pipefail
          test "$(git -C consumer-learning-git rev-parse HEAD)" = '01723a1825113de08810193f37e8047d978433c2'
          sha256sum consumer-learning-git/README.md > /tmp/p053-consumer-readme-before.sha256

      - name: Consume released P-053 Action
        id: generate
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/issue-template-generator@v0.8.0
        with:
          spec-json: >-
            {"name":"Learning repository bug","description":"Report a reproducible public learning-git problem","kind":"bug","title_prefix":"[BUG]","project_context":"the public learning-git repository","include_environment":true}

      - name: Re-consume released P-053 Action to prove determinism
        id: generate-again
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/issue-template-generator@v0.8.0
        with:
          spec-json: >-
            {"name":"Learning repository bug","description":"Report a reproducible public learning-git problem","kind":"bug","title_prefix":"[BUG]","project_context":"the public learning-git repository","include_environment":true}

      - name: Verify released-ref structure, privacy, determinism and no input mutation
        env:
          OUT: ${{ steps.generate.outputs.output-directory }}
          DIGEST: ${{ steps.generate.outputs.bundle-sha256 }}
          SECOND_DIGEST: ${{ steps.generate-again.outputs.bundle-sha256 }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'PyYAML>=6,<7'
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$DIGEST" = "$SECOND_DIGEST"
          sha256sum --check /tmp/p053-consumer-readme-before.sha256
          test "$(find "$OUT" -maxdepth 1 -type f | wc -l)" = 2
          python - <<'PY'
          import json, os
          from pathlib import Path
          import yaml
          out=Path(os.environ['OUT'])
          form=yaml.safe_load((out/'dais-support.yml').read_text(encoding='utf-8'))
          cfg=yaml.safe_load((out/'config.yml').read_text(encoding='utf-8'))
          assert set(form)=={'name','description','title','body'}
          assert cfg=={'blank_issues_enabled':False,'contact_links':[]}
          privacy=[x for x in form['body'] if x.get('id')=='privacy']
          assert len(privacy)==1 and privacy[0]['type']=='checkboxes'
          assert all(o.get('required') is True for o in privacy[0]['attributes']['options'])
          assert 'labels' not in form and 'assignees' not in form
          evidence={
            'schema_version':'1.0','evidence_type':'p053-released-ref-public-consumer','roadmap_id':'P-053',
            'release':'v0.8.0','released_source_commit':'2cbe70ae48d2813364f59aae180b3dcf92f7c9c3',
            'consumer_repository':'AntonyMD7/learning-git','consumer_commit':'01723a1825113de08810193f37e8047d978433c2',
            'bundle_sha256':os.environ['DIGEST'],'second_bundle_sha256':os.environ['SECOND_DIGEST'],
            'determinism':'PASS','yaml_syntax_and_bounded_structure':'PASS','privacy_controls':'PASS',
            'consumer_input_mutation_performed':False,'repository_mutation_performed':False,
            'network_request_performed_by_product':False,'github_schema_officially_validated':False,
            'roadmap_completion_promoted':False
          }
          Path('p053-released-ref-consumer.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print('P053_RELEASED_REF_CONSUMER=PASS')
          print('P053_RELEASED_REF_DETERMINISM=PASS')
          print('P053_CONSUMER_INPUT_MUTATION=NO')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY

      - name: Retain sanitized released-ref evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p053-released-ref-consumer-${{ github.run_id }}
          path: p053-released-ref-consumer.json
          retention-days: 30
          if-no-files-found: error
