name: P-050 Evidence Validation Action v0.3.0 release

on:
  pull_request:
    paths:
      - '.github/workflows/p050-evidence-validation-v0.3.0-release.yml'
      - 'release/p050-evidence-validation-v0.3.0.json'
      - 'RELEASE-NOTES-v0.3.0.md'
      - '.github/actions/governed-release/action.yml'
      - 'scripts/governed_release_manifest.py'
      - 'scripts/governed_release_publish.py'
      - 'tests/test_governed_release_toolkit.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/p050-evidence-validation-v0.3.0-release.yml'
      - 'release/p050-evidence-validation-v0.3.0.json'
      - 'RELEASE-NOTES-v0.3.0.md'

permissions:
  contents: read

concurrency:
  group: p050-evidence-validation-v0.3.0-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate P-050 exact-source release control
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed release-control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run governed-release adversarial tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'pytest>=8,<9'
          python -m pytest -q tests/test_governed_release_toolkit.py

      - name: Require exact P-050 source to be retained and ancestral
        run: |
          set -euo pipefail
          source_commit="$(python -c "import json;print(json.load(open('release/p050-evidence-validation-v0.3.0.json'))['source_commit'])")"
          test "$source_commit" = 'f00ad749a07a9067075c87f5ca20feab04695288'
          git cat-file -e "${source_commit}^{commit}"
          git merge-base --is-ancestor "$source_commit" "$GITHUB_SHA"
          echo 'P050_EXACT_RELEASE_SOURCE_RETAINED=PASS'

      - name: Exercise governed release in plan-only mode
        id: plan
        uses: ./.github/actions/governed-release
        with:
          manifest: release/p050-evidence-validation-v0.3.0.json
          publish: 'false'
          evidence-file: p050-v0.3.0-plan-evidence.json

      - name: Require non-mutating release plan
        env:
          ACTION_STATUS: ${{ steps.plan.outputs.status }}
        run: |
          set -euo pipefail
          test "$ACTION_STATUS" = READY_FOR_TRUSTED_PUSH
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('p050-v0.3.0-plan-evidence.json').read_text(encoding='utf-8'))
          assert d['mode'] == 'PLAN_ONLY'
          assert d['status'] == 'READY_FOR_TRUSTED_PUSH'
          assert d['draft_created'] is False
          assert d['published'] is False
          assert d['roadmap_completion_promoted'] is False
          print('P050_RELEASE_PLAN_ONLY=PASS')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY

      - name: Retain sanitized release-plan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p050-v0.3.0-release-plan-${{ github.run_id }}
          path: |
            governed-release-manifest-validation.json
            p050-v0.3.0-plan-evidence.json
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish exact-source P-050 v0.3.0
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish through governed release action
        id: publish
        uses: ./.github/actions/governed-release
        with:
          manifest: release/p050-evidence-validation-v0.3.0.json
          publish: 'true'
          allowed-ref: refs/heads/main
          evidence-file: p050-v0.3.0-publication-evidence.json

      - name: Independently verify public release and exact tag target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(python -c "import json;print(json.load(open('release/p050-evidence-validation-v0.3.0.json'))['tag'])")"
          source_commit="$(python -c "import json;print(json.load(open('release/p050-evidence-validation-v0.3.0.json'))['source_commit'])")"
          title="$(python -c "import json;print(json.load(open('release/p050-evidence-validation-v0.3.0.json'))['title'])")"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,name,targetCommitish,url,publishedAt > p050-v0.3.0-public-release.json
          python - "$tag" "$source_commit" "$title" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          tag, source, title = sys.argv[1:]
          release = json.loads(Path('p050-v0.3.0-public-release.json').read_text(encoding='utf-8'))
          assert release['isDraft'] is False
          assert release['isPrerelease'] is False
          assert release['tagName'] == tag
          assert release['name'] == title
          assert release['publishedAt']
          remote = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}.git"
          subprocess.run(['git','fetch','--force',remote,f'refs/tags/{tag}:refs/tags/{tag}'], check=True)
          resolved = subprocess.check_output(['git','rev-list','-n','1',tag], text=True).strip()
          assert resolved == source, (resolved, source)
          out = {
              'schema_version': '1.0',
              'evidence_type': 'p050-publication',
              'roadmap_ids': ['P-050'],
              'tag': tag,
              'intended_source_commit': source,
              'resolved_tag_commit': resolved,
              'release_url': release['url'],
              'published_at': release['publishedAt'],
              'exact_tag_target_verified': True,
              'roadmap_completion_promoted': False,
              'released_consumer_acceptance_required': True,
              'final_completion_audit_required': True,
          }
          Path('p050-v0.3.0-independent-release-verification.json').write_text(json.dumps(out, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          print('P050_V0_3_0_PUBLISHED=PASS')
          print('P050_EXACT_PUBLIC_TAG_VERIFIED=PASS')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY

      - name: Retain release and independent-verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p050-v0.3.0-publication-${{ github.run_id }}
          path: |
            governed-release-manifest-validation.json
            p050-v0.3.0-publication-evidence.json
            p050-v0.3.0-public-release.json
            p050-v0.3.0-independent-release-verification.json
          retention-days: 30
          if-no-files-found: error

  released-consumers:
    name: Released-ref consumer — ${{ matrix.consumer }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - consumer: learning-git
            repository: AntonyMD7/learning-git
          - consumer: Kimi-Haul
            repository: AntonyMD7/Kimi-Haul
    permissions:
      contents: read
    steps:
      - name: Checkout independent public consumer repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ matrix.repository }}
          path: consumer
          persist-credentials: false

      - name: Set up exact P-050 runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Build sanitized consumer evidence fixture
        shell: bash
        env:
          CONSUMER_REPO: ${{ matrix.repository }}
          CONSUMER_NAME: ${{ matrix.consumer }}
        run: |
          set -euo pipefail
          mkdir -p p050-consumer/artifacts
          printf 'P-050 released-ref consumer acceptance: %s\n' "$CONSUMER_NAME" > p050-consumer/artifacts/result.txt
          consumer_sha="$(git -C consumer rev-parse HEAD)"
          python - "$consumer_sha" <<'PY'
          import hashlib, json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path
          sha = sys.argv[1]
          artifact = Path('p050-consumer/artifacts/result.txt')
          record = {
              'schema_version': '0.1',
              'evidence_id': f"p050-consumer-{os.environ['CONSUMER_NAME']}-v030",
              'evidence_type': 'acceptance',
              'roadmap_ids': ['P-050'],
              'subject': {'type': 'repository', 'id': os.environ['CONSUMER_REPO'], 'version': sha},
              'operation': {
                  'classification': 'VERIFY',
                  'name': 'consume-released-p050-action',
                  'intended_change': None,
                  'authorization_ref': None,
                  'tool': 'DAIS Evidence Validation Action',
                  'tool_version': 'v0.3.0',
              },
              'observed_at_utc': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'pre_state': {'consumer_commit': sha},
              'result': {'status': 'PASS', 'exit_code': 0, 'summary': 'Sanitized released-ref fixture prepared for validation.'},
              'post_state': None,
              'artifacts': [{
                  'name': 'result.txt',
                  'sha256': hashlib.sha256(artifact.read_bytes()).hexdigest(),
                  'media_type': 'text/plain',
              }],
              'rollback': {'required': False, 'established': False, 'reference': None, 'exercised': None},
              'acceptance': [],
              'safety': {
                  'secrets_redacted': True,
                  'private_infrastructure_redacted': True,
                  'human_approval_required': False,
                  'approval_present': False,
              },
              'provenance': {
                  'producer': 'p050-v0.3.0-released-consumer-workflow',
                  'source_commit': sha,
                  'upstream_refs': ['https://github.com/AntonyMD7/amd-ryzen-ai-max-vgm-96gb/releases/tag/v0.3.0'],
              },
              'limitations': [
                  'This proves released Action consumption against a sanitized fixture in this public consumer checkout only.',
                  'Validation PASS is not producer authentication, semantic truth, or universal compatibility.',
              ],
          }
          Path('p050-consumer/evidence.json').write_text(json.dumps(record, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          PY

      - name: Consume immutable released P-050 Action ref
        id: p050
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/evidence-validate@v0.3.0
        with:
          evidence: p050-consumer/evidence.json
          artifact-root: p050-consumer/artifacts
          max-artifacts: '8'
          max-artifact-bytes: '1048576'

      - name: Record released-ref consumer acceptance
        shell: bash
        env:
          STATUS: ${{ steps.p050.outputs.status }}
          VERIFIED: ${{ steps.p050.outputs.verified-artifact-count }}
          REPORT_SHA: ${{ steps.p050.outputs.report-sha256 }}
          CONSUMER_REPO: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          test "$STATUS" = PASS
          test "$VERIFIED" = 1
          printf '%s' "$REPORT_SHA" | grep -Eq '^[0-9a-f]{64}$'
          consumer_sha="$(git -C consumer rev-parse HEAD)"
          python - "$consumer_sha" <<'PY'
          import json, os, sys
          from pathlib import Path
          out = {
              'schema_version': '1.0',
              'roadmap_id': 'P-050',
              'release_ref': 'v0.3.0',
              'consumer_repository': os.environ['CONSUMER_REPO'],
              'consumer_commit': sys.argv[1],
              'validation_status': os.environ['STATUS'],
              'verified_artifacts': int(os.environ['VERIFIED']),
              'validator_report_sha256': os.environ['REPORT_SHA'],
              'consumer_repository_mutated': False,
              'roadmap_completion_promoted': False,
          }
          Path('p050-released-consumer-acceptance.json').write_text(json.dumps(out, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          print('P050_RELEASED_REF_CONSUMER_ACCEPTANCE=PASS')
          print('CONSUMER_REPOSITORY_MUTATED=FALSE')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY

      - name: Retain sanitized consumer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p050-v0.3.0-consumer-${{ matrix.consumer }}-${{ github.run_id }}
          path: |
            p050-consumer/evidence.json
            p050-released-consumer-acceptance.json
          retention-days: 30
          if-no-files-found: error

  released-consumer-gate:
    name: Require both independent public consumers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: released-consumers
    runs-on: ubuntu-24.04
    steps:
      - name: Record matrix gate
        run: |
          echo 'P050_RELEASED_CONSUMERS=2/2_PASS'
          echo 'CONSUMERS=AntonyMD7/learning-git,AntonyMD7/Kimi-Haul'
          echo 'ROADMAP_COMPLETION_PROMOTED=FALSE'
