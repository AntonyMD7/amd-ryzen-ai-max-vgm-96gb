name: P-049 Secret Exposure Detection v0.6.0 governed release

on:
  pull_request:
    paths:
      - '.github/workflows/p049-secret-exposure-v0.6.0-release.yml'
      - 'release/p049-secret-exposure-v0.6.0.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/p049-secret-exposure-v0.6.0-release.yml'
      - 'release/p049-secret-exposure-v0.6.0.json'

permissions:
  contents: read

concurrency:
  group: p049-secret-exposure-v0.6.0-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed release-control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Require exact P-049 product source retained and ancestral
        run: |
          set -euo pipefail
          source_commit="$(python -c "import json;print(json.load(open('release/p049-secret-exposure-v0.6.0.json'))['source_commit'])")"
          git cat-file -e "${source_commit}^{commit}"
          git merge-base --is-ancestor "$source_commit" "$GITHUB_SHA"
          for p in \
            '.github/actions/secret-exposure-scan/action.yml' \
            '.github/actions/secret-exposure-scan/.gitleaksignore' \
            '.github/actions/secret-exposure-scan/gitleaks.toml' \
            '.github/actions/secret-exposure-scan/preflight.py' \
            '.github/actions/secret-exposure-scan/sanitize_report.py' \
            '.github/workflows/p049-secret-exposure-action.yml' \
            '.github/ISSUE_TEMPLATE/p049-secret-exposure.yml' \
            'docs/P049-SECRET-EXPOSURE-START-HERE.md' \
            'docs/P049-SECRET-EXPOSURE-ACTION.md' \
            'docs/P049-RELEASE-NOTES-v0.6.0.md' \
            'tests/test_p049_secret_exposure_action.py'; do
            git cat-file -e "${source_commit}:${p}"
          done
          echo 'P049_EXACT_PRODUCT_SOURCE_RETAINED=PASS'

      - name: Re-run P-049 adversarial product contract tests
        run: |
          set -euo pipefail
          python tests/test_p049_secret_exposure_action.py

      - name: Exercise governed release plan only
        id: plan
        uses: ./.github/actions/governed-release
        with:
          manifest: release/p049-secret-exposure-v0.6.0.json
          publish: 'false'
          evidence-file: p049-release-plan-evidence.json

      - name: Assert release plan is non-mutating
        env:
          ACTION_STATUS: ${{ steps.plan.outputs.status }}
        run: |
          set -euo pipefail
          test "$ACTION_STATUS" = READY_FOR_TRUSTED_PUSH
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('p049-release-plan-evidence.json').read_text())
          assert d['mode']=='PLAN_ONLY'
          assert d['published'] is False
          assert d['draft_created'] is False
          assert d['roadmap_completion_promoted'] is False
          print('P049_RELEASE_PLAN=PASS')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY

      - name: Retain sanitized release-plan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p049-release-plan-${{ github.run_id }}
          path: |
            governed-release-manifest-validation.json
            p049-release-plan-evidence.json
          retention-days: 14
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish exact P-049 source through governed release action
        id: publish
        uses: ./.github/actions/governed-release
        with:
          manifest: release/p049-secret-exposure-v0.6.0.json
          publish: 'true'
          allowed-ref: refs/heads/main
          evidence-file: p049-publication-evidence.json

      - name: Independently verify release and exact public tag target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(python -c "import json;print(json.load(open('release/p049-secret-exposure-v0.6.0.json'))['tag'])")"
          source_commit="$(python -c "import json;print(json.load(open('release/p049-secret-exposure-v0.6.0.json'))['source_commit'])")"
          title="$(python -c "import json;print(json.load(open('release/p049-secret-exposure-v0.6.0.json'))['title'])")"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,name,url,publishedAt > p049-public-release.json
          python - "$tag" "$source_commit" "$title" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          tag, source, title=sys.argv[1:]
          release=json.loads(Path('p049-public-release.json').read_text())
          assert release['isDraft'] is False
          assert release['tagName']==tag
          assert release['name']==title
          assert release['publishedAt']
          remote=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}.git"
          subprocess.run(['git','fetch','--force',remote,f'refs/tags/{tag}:refs/tags/{tag}'],check=True)
          resolved=subprocess.check_output(['git','rev-list','-n','1',tag],text=True).strip()
          assert resolved==source,(resolved,source)
          out={
            'schema_version':'1.0',
            'evidence_type':'p049-governed-release-publication',
            'roadmap_id':'P-049',
            'tag':tag,
            'intended_source_commit':source,
            'resolved_tag_commit':resolved,
            'release_url':release['url'],
            'published_at':release['publishedAt'],
            'exact_tag_target_verified':True,
            'roadmap_completion_promoted':False,
            'released_ref_acceptance_required':True,
            'final_completion_audit_required':True
          }
          Path('p049-independent-release-verification.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('P049_GOVERNED_RELEASE=PASS')
          print('P049_EXACT_PUBLIC_TAG=PASS')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY

      - name: Retain publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p049-publication-${{ github.run_id }}
          path: |
            governed-release-manifest-validation.json
            p049-publication-evidence.json
            p049-public-release.json
            p049-independent-release-verification.json
          retention-days: 30
          if-no-files-found: error

  released-consumer-acceptance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout public learning-git consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AntonyMD7/learning-git
          ref: main
          path: consumer-learning-git
          persist-credentials: false

      - name: Record exact consumer source and input hash
        id: consumer
        run: |
          set -euo pipefail
          commit="$(git -C consumer-learning-git rev-parse HEAD)"
          sha256sum consumer-learning-git/README.md > /tmp/p049-learning-before.sha256
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "P049_LEARNING_GIT_SOURCE=$commit"

      - name: Consume released P-049 ref against real public repository
        id: scan
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/secret-exposure-scan@v0.6.0
        with:
          root: consumer-learning-git

      - name: Require clean released-ref public-consumer acceptance
        env:
          STATUS: ${{ steps.scan.outputs.status }}
          FINDING_COUNT: ${{ steps.scan.outputs.finding-count }}
          FILE_COUNT: ${{ steps.scan.outputs.file-count }}
          RESULT_FILE: ${{ steps.scan.outputs.result-file }}
          RESULT_SHA256: ${{ steps.scan.outputs.result-sha256 }}
          GITLEAKS_VERSION: ${{ steps.scan.outputs.gitleaks-version }}
          CONSUMER_COMMIT: ${{ steps.consumer.outputs.commit }}
        run: |
          set -euo pipefail
          test "$STATUS" = PASS
          test "$FINDING_COUNT" = 0
          test "$FILE_COUNT" -ge 1
          test "$GITLEAKS_VERSION" = 8.30.0
          sha256sum --check /tmp/p049-learning-before.sha256
          test "$(sha256sum "$RESULT_FILE" | awk '{print $1}')" = "$RESULT_SHA256"
          cp "$RESULT_FILE" p049-released-learning-git-result.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads(Path('p049-released-learning-git-result.json').read_text())
          assert result['status']=='PASS'
          assert result['finding_count']==0
          assert result['privacy']['secret_values_retained'] is False
          data={
            'schema_version':'1.0',
            'roadmap_id':'P-049',
            'acceptance_type':'REAL_PUBLIC_REPOSITORY_RELEASED_REF',
            'released_ref':'v0.6.0',
            'consumer_repository':'AntonyMD7/learning-git',
            'consumer_commit':os.environ['CONSUMER_COMMIT'],
            'result':'PASS',
            'runtime_detection_canary_exercised_by_action':True,
            'runtime_clean_canary_exercised_by_action':True,
            'input_mutation_performed':False,
            'secret_values_retained':False,
            'raw_findings_retained':False,
            'roadmap_completion_promoted':False
          }
          Path('p049-released-consumer-evidence.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          print('P049_RELEASED_REAL_PUBLIC_CONSUMER=PASS')
          print('P049_RELEASED_RUNTIME_DETECTION_CANARY=PASS')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY

      - name: Retain privacy-minimized released-ref evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p049-released-ref-consumer-${{ github.run_id }}
          path: |
            p049-released-learning-git-result.json
            p049-released-consumer-evidence.json
          retention-days: 30
          if-no-files-found: error
