name: P-049 Secret Exposure Detection Action acceptance

on:
  pull_request:
    paths:
      - '.github/actions/secret-exposure-scan/**'
      - '.github/workflows/p049-secret-exposure-action.yml'
      - 'tests/test_p049_secret_exposure_action.py'
      - 'docs/P049-SECRET-EXPOSURE-START-HERE.md'
      - 'docs/P049-SECRET-EXPOSURE-ACTION.md'
      - '.github/ISSUE_TEMPLATE/p049-secret-exposure.yml'
  push:
    branches: [main]
    paths:
      - '.github/actions/secret-exposure-scan/**'
      - '.github/workflows/p049-secret-exposure-action.yml'
      - 'tests/test_p049_secret_exposure_action.py'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run P-049 adversarial contract tests
        run: |
          set -euo pipefail
          python tests/test_p049_secret_exposure_action.py

      - name: Create disposable clean and leak fixtures
        run: |
          set -euo pipefail
          rm -rf .p049-fixtures
          mkdir -p .p049-fixtures/clean .p049-fixtures/leak .p049-fixtures/symlink
          cat > .p049-fixtures/clean/README.md <<'EOF'
          # Clean public fixture

          This file contains ordinary documentation and no intentional secret fixture.
          EOF
          python3 - <<'PY'
          from pathlib import Path
          secret='ghp_' + 'aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789'
          Path('.p049-fixtures/leak/app.env').write_text('TOKEN=' + secret + ' # gitleaks:allow\n', encoding='utf-8')
          # An intentionally permissive repository-owned config must not weaken the Action's fixed policy.
          Path('.p049-fixtures/leak/.gitleaks.toml').write_text(
              'title = "repository controlled config must be ignored"\n[[allowlists]]\npaths = [".*"]\n',
              encoding='utf-8',
          )
          PY
          printf 'outside\n' > .p049-fixtures/symlink/real.txt
          ln -s real.txt .p049-fixtures/symlink/alias.txt
          sha256sum .p049-fixtures/clean/README.md > /tmp/p049-clean-before.sha256

      - name: Require clean bounded working tree to pass
        id: clean
        uses: ./.github/actions/secret-exposure-scan
        with:
          root: .p049-fixtures/clean

      - name: Verify clean result and input immutability
        env:
          STATUS: ${{ steps.clean.outputs.status }}
          FINDINGS: ${{ steps.clean.outputs.finding-count }}
          FILES: ${{ steps.clean.outputs.file-count }}
          RESULT: ${{ steps.clean.outputs.result-file }}
          RESULT_SHA256: ${{ steps.clean.outputs.result-sha256 }}
          VERSION: ${{ steps.clean.outputs.gitleaks-version }}
        run: |
          set -euo pipefail
          test "$STATUS" = PASS
          test "$FINDINGS" = 0
          test "$FILES" = 1
          test "$VERSION" = 8.30.0
          sha256sum --check /tmp/p049-clean-before.sha256
          test "$(sha256sum "$RESULT" | awk '{print $1}')" = "$RESULT_SHA256"
          python3 - "$RESULT" <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert data['status']=='PASS'
          assert data['privacy']['secret_values_retained'] is False
          assert data['privacy']['matched_text_retained'] is False
          assert data['privacy']['source_paths_retained'] is False
          assert data['scope']['git_history_scanned'] is False
          assert data['scope']['repository_code_executed'] is False
          assert data['policy']['repository_config_allowed'] is False
          assert data['policy']['inline_gitleaks_allow_allowed'] is False
          assert data['claims']['all_secrets_absent'] is False
          assert data['claims']['git_history_clean'] is False
          print('P049_CLEAN_ACCEPTANCE=PASS')
          print('P049_INPUT_MUTATION=NO')
          PY
          cp "$RESULT" p049-hosted-acceptance.json

      - name: Require secret-like fixture to fail despite repository bypass attempts
        id: leak
        continue-on-error: true
        uses: ./.github/actions/secret-exposure-scan
        with:
          root: .p049-fixtures/leak

      - name: Require symlink scope to fail closed
        id: symlink
        continue-on-error: true
        uses: ./.github/actions/secret-exposure-scan
        with:
          root: .p049-fixtures/symlink

      - name: Require parent traversal to fail closed
        id: traversal
        continue-on-error: true
        uses: ./.github/actions/secret-exposure-scan
        with:
          root: ../outside

      - name: Assert negative controls and emit sanitized acceptance evidence
        env:
          LEAK: ${{ steps.leak.outcome }}
          SYMLINK: ${{ steps.symlink.outcome }}
          TRAVERSAL: ${{ steps.traversal.outcome }}
        run: |
          set -euo pipefail
          test "$LEAK" = failure
          test "$SYMLINK" = failure
          test "$TRAVERSAL" = failure
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('p049-hosted-acceptance.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          data['acceptance']={
            'clean_fixture':'PASS',
            'runtime_detection_canary':'PASS',
            'runtime_clean_canary':'PASS',
            'secret_like_fixture':os.environ['LEAK'],
            'repository_config_bypass_attempt':'refused_by_fixed_action_config',
            'inline_gitleaks_allow_bypass_attempt':'refused_by_ignore-gitleaks-allow',
            'symlink_negative_control':os.environ['SYMLINK'],
            'traversal_negative_control':os.environ['TRAVERSAL'],
            'github_permissions':'contents:read',
            'runner_scope':'github-hosted-linux-x64',
            'gitleaks_version':'8.30.0',
            'gitleaks_linux_x64_archive_sha256':'79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e',
            'raw_secret_values_retained':False,
            'raw_scanner_output_retained':False,
            'roadmap_completion_claimed':False,
          }
          path.write_text(json.dumps(data, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          print('P049_NEGATIVE_CONTROLS=PASS')
          print('P049_RAW_SECRET_EVIDENCE_RETAINED=FALSE')
          print('ROADMAP_COMPLETION_CLAIMED=FALSE')
          PY
          rm -rf .p049-fixtures

      - name: Retain sanitized P-049 acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p049-secret-exposure-acceptance-${{ github.run_id }}
          path: p049-hosted-acceptance.json
          retention-days: 14
          if-no-files-found: error
