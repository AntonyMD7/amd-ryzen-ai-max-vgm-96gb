name: P-047 v0.4.0 completion audit

on:
  pull_request:
    paths:
      - '.github/workflows/p047-completion-v0.4.0.yml'
      - 'examples/public-build-completion-p047-v0.4.0.json'
      - 'docs/P047-COMPLETION-RECORD-v0.4.0.md'
      - 'tests/test_p047_completion_record.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/p047-completion-v0.4.0.yml'
      - 'examples/public-build-completion-p047-v0.4.0.json'
      - 'docs/P047-COMPLETION-RECORD-v0.4.0.md'
      - 'tests/test_p047_completion_record.py'

permissions:
  contents: read

jobs:
  completion-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed completion tranche
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Independently verify public release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.4.0 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,name,publishedAt,targetCommitish,url > /tmp/p047-release.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/p047-release.json'))
          assert d['isDraft'] is False
          assert d['isPrerelease'] is False
          assert d['tagName']=='v0.4.0'
          assert d['name']=='DAIS README Lint Action v0.4.0'
          assert d['publishedAt']
          print('P047_PUBLIC_RELEASE_IDENTITY=PASS')
          PY
          git fetch --force https://github.com/AntonyMD7/amd-ryzen-ai-max-vgm-96gb.git refs/tags/v0.4.0:refs/tags/v0.4.0
          test "$(git rev-list -n 1 v0.4.0)" = e8ec4a6f5dfbaadfaca46c98ad3679dce8e1ddd7
          git cat-file -e 'e8ec4a6f5dfbaadfaca46c98ad3679dce8e1ddd7:.github/actions/readme-lint/action.yml'
          echo 'P047_EXACT_RELEASE_SOURCE=PASS'

      - name: Re-run product and completion tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'pytest>=8,<9'
          python -m pytest -q tests/test_p047_readme_lint_contract.py tests/test_p047_completion_record.py

      - name: Execute canonical 19-gate auditor
        run: |
          set -euo pipefail
          python scripts/public_build_completion_contract.py examples/public-build-completion-p047-v0.4.0.json > p047-completion-audit.json
          python - <<'PY'
          import json
          d=json.load(open('p047-completion-audit.json'))
          assert d['declared_status']=='COMPLETE'
          assert d['readiness']=='COMPLETE_CONTRACT_SATISFIED'
          assert d['completion_contract_satisfied'] is True
          assert d['gate_counts']['PASS']==19
          assert d['blocking_gates']==[]
          assert d['errors']==[]
          assert d['safe_public_evidence_prefilter'] is True
          print('P047_19_GATE_COMPLETION_AUDIT=PASS')
          PY

      - name: Retain sanitized final audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p047-completion-audit-${{ github.run_id }}
          path: p047-completion-audit.json
          retention-days: 30
          if-no-files-found: error
