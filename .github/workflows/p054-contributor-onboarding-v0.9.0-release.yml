name: P-054 Contributor Onboarding Assistant v0.9.0 governed release

on:
  pull_request:
    paths:
      - '.github/workflows/p054-contributor-onboarding-v0.9.0-release.yml'
      - 'release/p054-contributor-onboarding-v0.9.0.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/p054-contributor-onboarding-v0.9.0-release.yml'
      - 'release/p054-contributor-onboarding-v0.9.0.json'

permissions:
  contents: read

concurrency:
  group: p054-contributor-onboarding-v0.9.0-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed release-control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Require exact P-054 product source retained and ancestral
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          manifest=json.loads(Path('release/p054-contributor-onboarding-v0.9.0.json').read_text())
          source=manifest['source_commit']
          subprocess.run(['git','cat-file','-e',f'{source}^{{commit}}'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor',source,os.environ['GITHUB_SHA']],check=True)
          for path in manifest['required_files']:
              subprocess.run(['git','cat-file','-e',f'{source}:{path}'],check=True)
          assert manifest['roadmap_ids']==['P-054']
          assert manifest['tag']=='v0.9.0'
          assert manifest['source_commit']=='290c358fb1569c85c6c9082efea2baefb30c5c75'
          assert manifest['roadmap_completion_on_publish'] is False
          print('P054_EXACT_PRODUCT_SOURCE_RETAINED=PASS')
          PY

      - name: Re-run P-054 adversarial product tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'pytest>=8,<9'
          python -m pytest -q tests/test_p054_contributor_onboarding.py

      - name: Exercise governed release plan only
        id: release-plan
        uses: ./.github/actions/governed-release
        with:
          manifest: release/p054-contributor-onboarding-v0.9.0.json
          publish: 'false'
          evidence-file: p054-release-plan-evidence.json

      - name: Require non-mutating release plan
        env:
          ACTION_STATUS: ${{ steps.release-plan.outputs.status }}
        run: |
          set -euo pipefail
          test "$ACTION_STATUS" = READY_FOR_TRUSTED_PUSH
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('p054-release-plan-evidence.json').read_text())
          assert d['mode']=='PLAN_ONLY'
          assert d['published'] is False
          assert d['draft_created'] is False
          assert d['roadmap_completion_promoted'] is False
          print('P054_RELEASE_PLAN=PASS')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY

      - name: Retain sanitized release-plan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p054-release-plan-${{ github.run_id }}
          path: |
            governed-release-manifest-validation.json
            p054-release-plan-evidence.json
          retention-days: 14
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish exact P-054 source through governed release action
        id: publish
        uses: ./.github/actions/governed-release
        with:
          manifest: release/p054-contributor-onboarding-v0.9.0.json
          publish: 'true'
          allowed-ref: refs/heads/main
          evidence-file: p054-publication-evidence.json

      - name: Independently verify public release and exact tag target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(python -c "import json;print(json.load(open('release/p054-contributor-onboarding-v0.9.0.json'))['tag'])")"
          source_commit="$(python -c "import json;print(json.load(open('release/p054-contributor-onboarding-v0.9.0.json'))['source_commit'])")"
          title="$(python -c "import json;print(json.load(open('release/p054-contributor-onboarding-v0.9.0.json'))['title'])")"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,name,url,publishedAt > p054-public-release.json
          python - "$tag" "$source_commit" "$title" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          tag, source, title=sys.argv[1:]
          release=json.loads(Path('p054-public-release.json').read_text())
          assert release['isDraft'] is False and release['isPrerelease'] is False
          assert release['tagName']==tag
          assert release['name']==title
          assert release['publishedAt']
          remote=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}.git"
          subprocess.run(['git','fetch','--force',remote,f'refs/tags/{tag}:refs/tags/{tag}'],check=True)
          resolved=subprocess.check_output(['git','rev-list','-n','1',tag],text=True).strip()
          assert resolved==source,(resolved,source)
          out={
            'schema_version':'1.0','evidence_type':'p054-governed-release-publication','roadmap_id':'P-054',
            'tag':tag,'intended_source_commit':source,'resolved_tag_commit':resolved,
            'release_url':release['url'],'published_at':release['publishedAt'],
            'exact_tag_target_verified':True,'roadmap_completion_promoted':False,
            'released_ref_acceptance_required':True,'final_completion_audit_required':True
          }
          Path('p054-independent-release-verification.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('P054_GOVERNED_RELEASE=PASS')
          print('P054_EXACT_PUBLIC_TAG=PASS')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY

      - name: Retain publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p054-publication-${{ github.run_id }}
          path: |
            governed-release-manifest-validation.json
            p054-publication-evidence.json
            p054-public-release.json
            p054-independent-release-verification.json
          retention-days: 30
          if-no-files-found: error

  released-public-consumer:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout canonical workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout pinned real public consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AntonyMD7/learning-git
          ref: 01723a1825113de08810193f37e8047d978433c2
          path: consumer-learning-git
          persist-credentials: false

      - name: Record consumer input immutability baseline
        run: |
          set -euo pipefail
          test "$(git -C consumer-learning-git rev-parse HEAD)" = '01723a1825113de08810193f37e8047d978433c2'
          sha256sum consumer-learning-git/README.md > /tmp/p054-consumer-readme-before.sha256
          test "$(git -C consumer-learning-git status --porcelain)" = ''

      - name: Consume released P-054 Action in English
        id: onboarding-en
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/contributor-onboarding@v0.9.0
        with:
          root: consumer-learning-git
          language: en

      - name: Re-consume released P-054 Action in English for determinism
        id: onboarding-en-again
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/contributor-onboarding@v0.9.0
        with:
          root: consumer-learning-git
          language: en

      - name: Consume released P-054 Action in Spanish
        id: onboarding-es
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/contributor-onboarding@v0.9.0
        with:
          root: consumer-learning-git
          language: es

      - name: Verify released-ref evidence, localization and no input mutation
        env:
          STATUS_EN: ${{ steps.onboarding-en.outputs.status }}
          STATUS_ES: ${{ steps.onboarding-es.outputs.status }}
          DIGEST_EN: ${{ steps.onboarding-en.outputs.report-sha256 }}
          DIGEST_EN_2: ${{ steps.onboarding-en-again.outputs.report-sha256 }}
          DIGEST_ES: ${{ steps.onboarding-es.outputs.report-sha256 }}
          REPORT_EN: ${{ steps.onboarding-en.outputs.report-path }}
          REPORT_ES: ${{ steps.onboarding-es.outputs.report-path }}
          GUIDE_EN: ${{ steps.onboarding-en.outputs.guide-path }}
          GUIDE_ES: ${{ steps.onboarding-es.outputs.guide-path }}
        run: |
          set -euo pipefail
          [[ "$STATUS_EN" = ONBOARDING_BASELINE_READY || "$STATUS_EN" = ONBOARDING_BASELINE_HAS_GAPS ]]
          test "$STATUS_EN" = "$STATUS_ES"
          [[ "$DIGEST_EN" =~ ^[0-9a-f]{64}$ ]]
          test "$DIGEST_EN" = "$DIGEST_EN_2"
          sha256sum --check /tmp/p054-consumer-readme-before.sha256
          test "$(git -C consumer-learning-git status --porcelain)" = ''
          python - <<'PY'
          import json, os
          from pathlib import Path
          en=json.loads(Path(os.environ['REPORT_EN']).read_text())
          es=json.loads(Path(os.environ['REPORT_ES']).read_text())
          for report in (en,es):
              assert report['roadmap_id']=='P-054'
              assert report['execution']['network_request_performed'] is False
              assert report['execution']['repository_mutation_performed'] is False
              assert report['execution']['repository_code_executed'] is False
              assert report['claims']['github_community_profile_verified'] is False
              assert report['claims']['contributor_readiness_guaranteed'] is False
          # Language changes guide presentation, not evidence truth/status.
          assert en['status']==es['status']
          assert en['missing_required_count']==es['missing_required_count']
          eng=Path(os.environ['GUIDE_EN']).read_text(encoding='utf-8')
          spa=Path(os.environ['GUIDE_ES']).read_text(encoding='utf-8')
          assert eng != spa
          assert 'credentials' in eng.lower()
          evidence={
            'schema_version':'1.0','evidence_type':'p054-released-ref-public-consumer','roadmap_id':'P-054',
            'release':'v0.9.0','released_source_commit':'290c358fb1569c85c6c9082efea2baefb30c5c75',
            'consumer_repository':'AntonyMD7/learning-git','consumer_commit':'01723a1825113de08810193f37e8047d978433c2',
            'status':os.environ['STATUS_EN'],'english_report_sha256':os.environ['DIGEST_EN'],
            'repeat_english_report_sha256':os.environ['DIGEST_EN_2'],'spanish_report_sha256':os.environ['DIGEST_ES'],
            'determinism':'PASS','english_spanish_truth_state_consistent':'PASS',
            'consumer_input_mutation_performed':False,'repository_mutation_performed':False,
            'network_request_performed_by_product':False,'repository_code_executed_by_product':False,
            'github_community_profile_verified':False,'contributor_readiness_guaranteed':False,
            'roadmap_completion_promoted':False
          }
          Path('p054-released-ref-consumer.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print('P054_RELEASED_REF_CONSUMER=PASS')
          print('P054_RELEASED_REF_DETERMINISM=PASS')
          print('P054_EN_ES_TRUTH_STATE=PASS')
          print('P054_CONSUMER_INPUT_MUTATION=NO')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY

      - name: Retain sanitized released-ref evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p054-released-ref-consumer-${{ github.run_id }}
          path: p054-released-ref-consumer.json
          retention-days: 30
          if-no-files-found: error
