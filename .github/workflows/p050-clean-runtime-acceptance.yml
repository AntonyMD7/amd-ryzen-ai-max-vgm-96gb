name: P-050 clean runtime acceptance

on:
  pull_request:
    paths:
      - '.github/actions/evidence-validate/**'
      - '.github/workflows/p050-clean-runtime-acceptance.yml'
      - 'scripts/evidence_validate.py'
      - 'schemas/universal-evidence-v0.1.schema.json'
      - 'examples/universal-evidence-readonly-example.json'
  push:
    branches: [main]
    paths:
      - '.github/actions/evidence-validate/**'
      - '.github/workflows/p050-clean-runtime-acceptance.yml'
      - 'scripts/evidence_validate.py'
      - 'schemas/universal-evidence-v0.1.schema.json'
      - 'examples/universal-evidence-readonly-example.json'

permissions:
  contents: read

jobs:
  clean-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up exact supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Prove validation dependencies are absent before Action
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('jsonschema') is None, 'clean-runtime lane unexpectedly preinstalled jsonschema'
          print('P050_CLEAN_RUNTIME_PRECONDITION=PASS')
          PY

      - name: Build clean-runtime fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p050-clean/artifacts"
          printf 'P-050 clean runtime acceptance\n' > "$RUNNER_TEMP/p050-clean/artifacts/result.txt"
          python - "$RUNNER_TEMP/p050-clean/artifacts/result.txt" "$RUNNER_TEMP/p050-clean/evidence.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          artifact = Path(sys.argv[1])
          record = json.loads(Path('examples/universal-evidence-readonly-example.json').read_text(encoding='utf-8'))
          record['evidence_id'] = 'p050-clean-runtime-acceptance'
          record['artifacts'] = [{
              'name': 'result.txt',
              'sha256': hashlib.sha256(artifact.read_bytes()).hexdigest(),
              'media_type': 'text/plain',
          }]
          Path(sys.argv[2]).write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Exercise Action from dependency-clean runner
        id: validate
        uses: ./.github/actions/evidence-validate
        with:
          evidence: ${{ runner.temp }}/p050-clean/evidence.json
          artifact-root: ${{ runner.temp }}/p050-clean/artifacts
          max-artifacts: '8'
          max-artifact-bytes: '1048576'

      - name: Require exact runtime and validation result
        shell: bash
        env:
          STATUS: ${{ steps.validate.outputs.status }}
          VERIFIED: ${{ steps.validate.outputs.verified-artifact-count }}
          REPORT_SHA: ${{ steps.validate.outputs.report-sha256 }}
        run: |
          set -euo pipefail
          test "$STATUS" = PASS
          test "$VERIFIED" = 1
          printf '%s' "$REPORT_SHA" | grep -Eq '^[0-9a-f]{64}$'
          python - <<'PY'
          import importlib.metadata as md
          expected = {
              'jsonschema': '4.26.0',
              'attrs': '25.3.0',
              'jsonschema-specifications': '2025.9.1',
              'referencing': '0.37.0',
              'rpds-py': '0.27.1',
              'typing-extensions': '4.16.0',
          }
          assert {k: md.version(k) for k in expected} == expected
          print('P050_CLEAN_RUNTIME_ACCEPTANCE=PASS')
          print('ROADMAP_COMPLETION_CLAIMED=FALSE')
          PY
