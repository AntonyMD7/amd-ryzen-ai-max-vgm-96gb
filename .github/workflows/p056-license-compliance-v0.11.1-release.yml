name: P-056 License Compliance Checker v0.11.1 governed release

on:
  pull_request:
    paths:
      - '.github/workflows/p056-license-compliance-v0.11.1-release.yml'
      - 'release/p056-license-compliance-v0.11.1.json'
      - 'docs/P056-RELEASE-NOTES-v0.11.1.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/p056-license-compliance-v0.11.1-release.yml'
      - 'release/p056-license-compliance-v0.11.1.json'
      - 'docs/P056-RELEASE-NOTES-v0.11.1.md'

permissions:
  contents: read
  actions: read

concurrency:
  group: p056-license-compliance-v0.11.1-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed release-control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require exact v0.11.1 product source retained and ancestral
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          m=json.loads(Path('release/p056-license-compliance-v0.11.1.json').read_text())
          source=m['source_commit']
          assert source=='a7b6dfa494e3fac6d7d20cab651b47f686e92495'
          assert m['roadmap_ids']==['P-056'] and m['tag']=='v0.11.1'
          assert m['roadmap_completion_on_publish'] is False
          subprocess.run(['git','cat-file','-e',f'{source}^{{commit}}'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor',source,os.environ['GITHUB_SHA']],check=True)
          for path in m['required_files']:
              subprocess.run(['git','cat-file','-e',f'{source}:{path}'],check=True)
          patch=subprocess.check_output(['git','show',f'{source}:scripts/p056_license_compliance_v0111.py'],text=True)
          action=subprocess.check_output(['git','show',f'{source}:.github/actions/license-compliance/action.yml'],text=True)
          assert 'VERSION = "0.11.1"' in patch
          assert 'evidence_identity_profile' in patch and 'raw_report_sha256' in patch
          assert 'p056_license_compliance_v0111.py' in action
          assert 'raw-report-sha256' in action
          print('P056_V0111_EXACT_SOURCE_RETAINED=PASS')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY
      - name: Re-run v0.11.1 adversarial tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'pytest>=8,<9'
          python -m pytest -q tests/test_p056_license_compliance.py tests/test_p056_deterministic_evidence.py
      - name: Re-verify exact-main source acceptance evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31944984361" > p056-v0111-source-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31944984361/artifacts" > p056-v0111-source-artifacts.json
          python - <<'PY'
          import json
          from pathlib import Path
          run=json.loads(Path('p056-v0111-source-run.json').read_text())
          assert run['conclusion']=='success'
          assert run['head_sha']=='a7b6dfa494e3fac6d7d20cab651b47f686e92495'
          arts=json.loads(Path('p056-v0111-source-artifacts.json').read_text())['artifacts']
          found={a['name']:(str(a['id']),a.get('digest')) for a in arts}
          assert found.get('p056-source-acceptance-31944984361')==('9263031133','sha256:d73f4d8357c375f0bc1a8d4ad0a916ca5adf219eaef9c6806ad04dcf3a3974f7')
          print('P056_V0111_SOURCE_ACCEPTANCE_EVIDENCE=PASS')
          PY
      - name: Exercise governed release plan only
        id: plan
        uses: ./.github/actions/governed-release
        with:
          manifest: release/p056-license-compliance-v0.11.1.json
          publish: 'false'
          evidence-file: p056-v0111-release-plan-evidence.json
      - name: Require non-mutating release plan
        env:
          ACTION_STATUS: ${{ steps.plan.outputs.status }}
        run: |
          set -euo pipefail
          test "$ACTION_STATUS" = READY_FOR_TRUSTED_PUSH
          python - <<'PY'
          import json
          d=json.load(open('p056-v0111-release-plan-evidence.json'))
          assert d['mode']=='PLAN_ONLY' and d['published'] is False
          assert d['roadmap_completion_promoted'] is False
          print('P056_V0111_RELEASE_PLAN=PASS')
          PY
      - name: Retain sanitized release-plan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p056-v0111-release-plan-${{ github.run_id }}
          path: |
            governed-release-manifest-validation.json
            p056-v0111-release-plan-evidence.json
            p056-v0111-source-run.json
            p056-v0111-source-artifacts.json
          retention-days: 14
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish exact v0.11.1 source through governed release action
        id: publish
        uses: ./.github/actions/governed-release
        with:
          manifest: release/p056-license-compliance-v0.11.1.json
          publish: 'true'
          allowed-ref: refs/heads/main
          evidence-file: p056-v0111-publication-evidence.json
      - name: Independently verify public release and exact tag target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.11.1 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,name,url,publishedAt > p056-v0111-public-release.json
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          release=json.loads(Path('p056-v0111-public-release.json').read_text())
          assert release['isDraft'] is False and release['isPrerelease'] is False
          assert release['tagName']=='v0.11.1' and release['name']=='DAIS License Compliance Checker v0.11.1'
          remote=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}.git"
          subprocess.run(['git','fetch','--force',remote,'refs/tags/v0.11.1:refs/tags/v0.11.1'],check=True)
          resolved=subprocess.check_output(['git','rev-list','-n','1','v0.11.1'],text=True).strip()
          assert resolved=='a7b6dfa494e3fac6d7d20cab651b47f686e92495'
          out={'schema_version':'1.0','evidence_type':'p056-v0111-governed-release-publication','roadmap_id':'P-056','tag':'v0.11.1','intended_source_commit':'a7b6dfa494e3fac6d7d20cab651b47f686e92495','resolved_tag_commit':resolved,'release_url':release['url'],'published_at':release['publishedAt'],'exact_tag_target_verified':True,'roadmap_completion_promoted':False}
          Path('p056-v0111-independent-release-verification.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('P056_V0111_GOVERNED_RELEASE=PASS')
          print('P056_V0111_EXACT_PUBLIC_TAG=PASS')
          PY
      - name: Retain publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p056-v0111-publication-${{ github.run_id }}
          path: |
            governed-release-manifest-validation.json
            p056-v0111-publication-evidence.json
            p056-v0111-public-release.json
            p056-v0111-independent-release-verification.json
          retention-days: 30
          if-no-files-found: error

  released-public-consumer:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout canonical workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout pinned real public consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AntonyMD7/learning-git
          ref: 01723a1825113de08810193f37e8047d978433c2
          path: consumer-learning-git
          persist-credentials: false
      - name: Record consumer input immutability baseline
        run: |
          set -euo pipefail
          test "$(git -C consumer-learning-git rev-parse HEAD)" = '01723a1825113de08810193f37e8047d978433c2'
          sha256sum consumer-learning-git/README.md > /tmp/p056-v0111-readme-before.sha256
          test "$(git -C consumer-learning-git status --porcelain)" = ''
      - name: Consume released v0.11.1 in English
        id: en
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/license-compliance@v0.11.1
        with:
          root: consumer-learning-git
          language: en
          source-revision: 01723a1825113de08810193f37e8047d978433c2
      - name: Re-consume released v0.11.1 in English
        id: en2
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/license-compliance@v0.11.1
        with:
          root: consumer-learning-git
          language: en
          source-revision: 01723a1825113de08810193f37e8047d978433c2
      - name: Consume released v0.11.1 in Spanish
        id: es
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/license-compliance@v0.11.1
        with:
          root: consumer-learning-git
          language: es
          source-revision: 01723a1825113de08810193f37e8047d978433c2
      - name: Verify released-ref semantic determinism, localization truth and zero mutation
        env:
          STATUS_EN: ${{ steps.en.outputs.status }}
          STATUS_ES: ${{ steps.es.outputs.status }}
          DIGEST_EN: ${{ steps.en.outputs.report-sha256 }}
          DIGEST_EN2: ${{ steps.en2.outputs.report-sha256 }}
          DIGEST_ES: ${{ steps.es.outputs.report-sha256 }}
          RAW_EN: ${{ steps.en.outputs.raw-report-sha256 }}
          RAW_EN2: ${{ steps.en2.outputs.raw-report-sha256 }}
          RAW_ES: ${{ steps.es.outputs.raw-report-sha256 }}
          REPORT_EN: ${{ steps.en.outputs.report-path }}
          REPORT_ES: ${{ steps.es.outputs.report-path }}
          GUIDE_EN: ${{ steps.en.outputs.guide-path }}
          GUIDE_ES: ${{ steps.es.outputs.guide-path }}
        run: |
          set -euo pipefail
          test "$STATUS_EN" = 'REUSE_NONCOMPLIANT' && test "$STATUS_EN" = "$STATUS_ES"
          test "$DIGEST_EN" = "$DIGEST_EN2" && test "$DIGEST_EN" = "$DIGEST_ES"
          [[ "$RAW_EN" =~ ^[0-9a-f]{64}$ ]] && [[ "$RAW_EN2" =~ ^[0-9a-f]{64}$ ]] && [[ "$RAW_ES" =~ ^[0-9a-f]{64}$ ]]
          sha256sum --check /tmp/p056-v0111-readme-before.sha256
          test "$(git -C consumer-learning-git status --porcelain)" = ''
          python - <<'PY'
          import json, os
          from pathlib import Path
          en=json.loads(Path(os.environ['REPORT_EN']).read_text()); es=json.loads(Path(os.environ['REPORT_ES']).read_text())
          assert en==es
          assert en['product']['version']=='0.11.1' and en['roadmap_id']=='P-056'
          assert en['authority']['evidence_identity_profile']=='semantic-v1'
          assert en['source']['raw_reuse_report_sha256_in_deterministic_record'] is False
          assert 'raw_reuse_report_sha256' not in en['source']
          assert en['execution']['repository_mutation_performed'] is False
          assert en['claims']['legal_permission_established'] is False
          assert en['claims']['license_compatibility_established'] is False
          assert Path(os.environ['GUIDE_EN']).read_text()!=Path(os.environ['GUIDE_ES']).read_text()
          assert 'README.md' not in json.dumps(en)
          evidence={'schema_version':'1.0','evidence_type':'p056-v0111-released-ref-public-consumer','roadmap_id':'P-056','release':'v0.11.1','released_source_commit':'a7b6dfa494e3fac6d7d20cab651b47f686e92495','consumer_repository':'AntonyMD7/learning-git','consumer_commit':'01723a1825113de08810193f37e8047d978433c2','status':os.environ['STATUS_EN'],'deterministic_report_sha256':os.environ['DIGEST_EN'],'repeat_report_sha256':os.environ['DIGEST_EN2'],'spanish_report_sha256':os.environ['DIGEST_ES'],'raw_run_sha256_values':[os.environ['RAW_EN'],os.environ['RAW_EN2'],os.environ['RAW_ES']],'semantic_determinism':'PASS','language_truth_state_consistent':'PASS','consumer_input_mutation_performed':False,'roadmap_completion_promoted':False}
          Path('p056-v0111-released-ref-consumer.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print('P056_V0111_RELEASED_REF_CONSUMER=PASS')
          print('P056_V0111_SEMANTIC_DETERMINISM=PASS')
          print('P056_V0111_INPUT_MUTATION=NO')
          PY
          mkdir -p p056-v0111-released-evidence
          cp p056-v0111-released-ref-consumer.json p056-v0111-released-evidence/
          cp "$REPORT_EN" p056-v0111-released-evidence/public-report.json
          cp "$GUIDE_EN" p056-v0111-released-evidence/guide-en.md
          cp "$GUIDE_ES" p056-v0111-released-evidence/guide-es.md
      - name: Retain sanitized released-ref evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p056-v0111-released-ref-${{ github.run_id }}
          path: p056-v0111-released-evidence/
          retention-days: 30
          if-no-files-found: error
