name: Local AI Doctor runtime footprint acceptance

on:
  push:
    paths:
      - 'scripts/ollama_runtime_footprint_acceptance.py'
      - 'tests/test_ollama_runtime_footprint_acceptance.py'
      - '.github/workflows/local-ai-doctor-runtime-footprint-acceptance.yml'
      - 'docs/LOCAL-AI-DOCTOR-RUNTIME-FOOTPRINT.md'

permissions:
  contents: read

jobs:
  exact-runtime-footprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OLLAMA_VERSION: 0.32.5
      OLLAMA_HOST: 127.0.0.1:11434
      ACCEPTANCE_MODEL: smollm:135m
      ACCEPTANCE_NUM_CTX: '2048'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<9'

      - name: Run runtime-footprint contract tests
        run: python -m pytest -q tests/test_ollama_runtime_footprint_acceptance.py

      - name: Install pinned Ollama release on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/install.sh" \
            -o /tmp/ollama-install.sh
          printf '%s  %s\n' \
            '25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f' \
            '/tmp/ollama-install.sh' > /tmp/ollama-install.sha256
          sha256sum --check /tmp/ollama-install.sha256
          OLLAMA_VERSION="$OLLAMA_VERSION" sh /tmp/ollama-install.sh
          ollama --version

      - name: Start loopback-only Ollama
        shell: bash
        run: |
          set -euo pipefail
          OLLAMA_HOST="$OLLAMA_HOST" ollama serve >/tmp/ollama-runtime-footprint.log 2>&1 &
          echo $! > /tmp/ollama-runtime-footprint.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:11434/api/version > /tmp/ollama-version.json; then
              python - <<'PY'
          import json, os
          data=json.load(open('/tmp/ollama-version.json', encoding='utf-8'))
          assert data.get('version') == os.environ['OLLAMA_VERSION'], data
          print('PINNED_OLLAMA_RUNTIME=PASS')
          PY
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/ollama-runtime-footprint.log >&2 || true
          exit 1

      - name: Pull exact tiny public acceptance model into disposable runner only
        shell: bash
        run: |
          set -euo pipefail
          ollama pull "$ACCEPTANCE_MODEL"
          curl --fail --silent http://127.0.0.1:11434/api/tags > /tmp/ollama-runtime-tags.json
          python - <<'PY'
          import json, os
          tags=json.load(open('/tmp/ollama-runtime-tags.json', encoding='utf-8'))
          expected=os.environ['ACCEPTANCE_MODEL']
          matches=[m for m in tags.get('models', []) if (m.get('model') or m.get('name')) == expected]
          assert len(matches) == 1, matches
          digest=matches[0].get('digest')
          assert isinstance(digest, str) and len(digest) >= 32
          print('EXACT_ACCEPTANCE_MODEL_PRESENT=PASS')
          print('MODEL_DOWNLOAD_PERFORMED_BY_PROBE=FALSE')
          PY

      - name: Run bounded exact-model runtime footprint acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local-ai-runtime-footprint-evidence
          python scripts/ollama_runtime_footprint_acceptance.py \
            --base-url http://127.0.0.1:11434 \
            --model "$ACCEPTANCE_MODEL" \
            --num-ctx "$ACCEPTANCE_NUM_CTX" \
            --allow-inference \
            > local-ai-runtime-footprint-evidence/runtime-footprint.json

      - name: Enforce runtime evidence and non-overclaim boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('local-ai-runtime-footprint-evidence/runtime-footprint.json').read_text(encoding='utf-8'))
          assert data['transport'] == 'LOOPBACK_HTTP_ONLY'
          assert data['runtime_footprint']['exact_model_loaded'] is True
          assert data['runtime_footprint']['digest_matches_installed'] is True
          assert isinstance(data['runtime_footprint']['size_bytes'], int) and data['runtime_footprint']['size_bytes'] > 0
          assert isinstance(data['runtime_footprint']['size_vram_bytes'], int) and data['runtime_footprint']['size_vram_bytes'] >= 0
          assert isinstance(data['runtime_footprint']['context_length'], int) and data['runtime_footprint']['context_length'] > 0
          assert data['show_metadata']['license_metadata_present'] is True
          assert data['show_metadata']['license_text_retained'] is False
          assert isinstance(data['show_metadata']['license_text_sha256'], str) and len(data['show_metadata']['license_text_sha256']) == 64
          assert data['inference']['performed'] is True
          assert data['inference']['response_text_retained'] is False
          assert isinstance(data['inference']['eval_count'], int) and data['inference']['eval_count'] > 0
          assert isinstance(data['inference']['eval_duration_ns'], int) and data['inference']['eval_duration_ns'] > 0
          for key in (
              'license_compatibility_verified',
              'upstream_model_provenance_verified',
              'accelerator_support_verified',
              'maximum_context_capacity_verified',
              'performance_characterized',
              'model_quality_verified',
              'production_ready',
              'roadmap_complete',
          ):
              assert data['claims'][key] is False, (key, data['claims'][key])
          assert all(value is False for value in data['safety'].values())
          print('EXACT_RUNTIME_FOOTPRINT_OBSERVATION=PASS')
          print('LICENSE_METADATA_HASHED_NOT_RETAINED=PASS')
          print('PERFORMANCE_CHARACTERIZED=FALSE')
          print('PRODUCTION_READY=FALSE')
          PY

      - name: Independently require expected license family without retaining text
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            http://127.0.0.1:11434/api/show \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"${ACCEPTANCE_MODEL}\",\"verbose\":false}" \
            > /tmp/ollama-show-license.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/ollama-show-license.json', encoding='utf-8'))
          license_text=data.get('license')
          assert isinstance(license_text, str) and 'Apache License' in license_text
          print('EXPECTED_ACCEPTANCE_MODEL_LICENSE_FAMILY_OBSERVED=PASS')
          print('LICENSE_TEXT_RETAINED=FALSE')
          print('LICENSE_COMPATIBILITY_VERIFIED=FALSE')
          PY
          rm -f /tmp/ollama-show-license.json

      - name: Stop ephemeral Ollama server
        if: always()
        shell: bash
        run: |
          if test -f /tmp/ollama-runtime-footprint.pid; then
            kill "$(cat /tmp/ollama-runtime-footprint.pid)" 2>/dev/null || true
          fi

      - name: Upload sanitized runtime footprint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-doctor-runtime-footprint-${{ github.run_id }}
          path: local-ai-runtime-footprint-evidence/runtime-footprint.json
          if-no-files-found: warn
          retention-days: 14
