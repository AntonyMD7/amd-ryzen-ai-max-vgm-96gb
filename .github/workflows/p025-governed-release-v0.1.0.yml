name: P-025 governed release v0.1.0

on:
  pull_request:
    paths:
      - '.github/workflows/p025-governed-release-v0.1.0.yml'
      - 'release/p025-v0.1.0.json'
      - 'RELEASE-NOTES-v0.1.0.md'
      - 'scripts/release_manifest_validate.py'
      - 'scripts/release_readiness_verify.py'
      - 'scripts/public_build_completion_contract.py'
      - 'tests/test_release_manifest_validate.py'
      - 'tests/test_release_readiness_verify.py'
      - 'examples/public-build-completion-p025-in-progress.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/p025-governed-release-v0.1.0.yml'
      - 'release/p025-v0.1.0.json'
      - 'RELEASE-NOTES-v0.1.0.md'
      - 'scripts/release_manifest_validate.py'
      - 'tests/test_release_manifest_validate.py'

permissions:
  contents: read

concurrency:
  group: p025-governed-release-v0.1.0
  cancel-in-progress: false

jobs:
  validate:
    name: Validate exact release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_commit: ${{ steps.manifest.outputs.source_commit }}
      tag: ${{ steps.manifest.outputs.tag }}
      title: ${{ steps.manifest.outputs.title }}
      notes_file: ${{ steps.manifest.outputs.notes_file }}
    steps:
      - name: Checkout reviewed release control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check 'jsonschema>=4.23,<5' 'pytest>=8,<9'

      - name: Validate static release manifest and contract tests
        run: |
          set -euo pipefail
          python scripts/release_manifest_validate.py \
            release/p025-v0.1.0.json \
            --output release-manifest-validation.json
          python -m pytest -q \
            tests/test_release_manifest_validate.py \
            tests/test_release_readiness_verify.py \
            tests/test_public_build_completion_contract.py

      - name: Export validated manifest values
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d = json.loads(Path('release/p025-v0.1.0.json').read_text(encoding='utf-8'))
          for key in ('source_commit', 'tag', 'title', 'notes_file'):
              value = d[key]
              if '\n' in value or '\r' in value:
                  raise SystemExit(f'unsafe newline in {key}')
              print(f'{key}={value}')
          PY

      - name: Require candidate commit to be retained in reviewed history
        env:
          SOURCE_COMMIT: ${{ steps.manifest.outputs.source_commit }}
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$GITHUB_SHA"

      - name: Checkout exact release candidate separately
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.manifest.outputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false
          path: candidate

      - name: Re-run canonical readiness against exact candidate
        env:
          SOURCE_COMMIT: ${{ steps.manifest.outputs.source_commit }}
          RELEASE_TAG: ${{ steps.manifest.outputs.tag }}
        run: |
          set -euo pipefail
          python scripts/release_readiness_verify.py \
            examples/public-build-completion-p025-in-progress.json \
            --tag "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --repo-root candidate \
            --output pre-release-readiness.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('pre-release-readiness.json').read_text(encoding='utf-8'))
          assert d['decision'] == 'READY_FOR_GOVERNED_RELEASE_CREATION_REVIEW'
          assert d['subject_id'] == 'P-025'
          assert d['completion_contract']['completion_contract_satisfied'] is False
          assert d['execution']['release_created'] is False
          assert d['execution']['tag_created'] is False
          print('P025_PRE_RELEASE_READINESS=PASS')
          print('ROADMAP_COMPLETION_BEFORE_RELEASE=FALSE')
          PY

      - name: Retain sanitized pre-release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p025-pre-release-${{ github.run_id }}
          path: |
            release-manifest-validation.json
            pre-release-readiness.json
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Draft verify and publish exact P-025 release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse pre-existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists; refusing overwrite" >&2
            exit 2
          fi
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "tag already exists; refusing overwrite" >&2
            exit 2
          fi
          echo 'PREEXISTING_RELEASE_OR_TAG=FALSE'

      - name: Create reviewed draft release at exact attested source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_TITLE: ${{ needs.validate.outputs.title }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          NOTES_FILE: ${{ needs.validate.outputs.notes_file }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --draft

      - name: Verify draft identity before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_TITLE: ${{ needs.validate.outputs.title }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,tagName,name,targetCommitish > draft-release.json
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg title "$RELEASE_TITLE" \
            --arg source "$SOURCE_COMMIT" \
            '.isDraft == true and .tagName == $tag and .name == $title and .targetCommitish == $source' \
            draft-release.json >/dev/null
          echo 'DRAFT_RELEASE_IDENTITY=PASS'

      - name: Publish reviewed draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Verify published release and exact tag target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_TITLE: ${{ needs.validate.outputs.title }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,tagName,name,targetCommitish,url,publishedAt > published-release.json
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg title "$RELEASE_TITLE" \
            '.isDraft == false and .tagName == $tag and .name == $title and (.publishedAt | length > 0)' \
            published-release.json >/dev/null

          git fetch --force "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          resolved="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$resolved" = "$SOURCE_COMMIT"

          RELEASE_TAG="$RELEASE_TAG" SOURCE_COMMIT="$SOURCE_COMMIT" RESOLVED_COMMIT="$resolved" python - <<'PY'
          import json
          import os
          from pathlib import Path
          release = json.loads(Path('published-release.json').read_text(encoding='utf-8'))
          out = {
              'schema_version': '1.0',
              'evidence_type': 'p025-governed-release-publication',
              'roadmap_id': 'P-025',
              'tag': os.environ['RELEASE_TAG'],
              'intended_source_commit': os.environ['SOURCE_COMMIT'],
              'resolved_tag_commit': os.environ['RESOLVED_COMMIT'],
              'release_url': release['url'],
              'published_at': release['publishedAt'],
              'draft': release['isDraft'],
              'exact_tag_target_verified': os.environ['SOURCE_COMMIT'] == os.environ['RESOLVED_COMMIT'],
              'roadmap_completion_promoted': False,
              'final_handover_required': True,
          }
          Path('p025-release-publication-evidence.json').write_text(
              json.dumps(out, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print('P025_RELEASE_PUBLISHED=TRUE')
          print('EXACT_TAG_TARGET_VERIFIED=TRUE')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY

      - name: Retain publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p025-release-publication-${{ github.run_id }}
          path: |
            draft-release.json
            published-release.json
            p025-release-publication-evidence.json
          retention-days: 30
          if-no-files-found: error
