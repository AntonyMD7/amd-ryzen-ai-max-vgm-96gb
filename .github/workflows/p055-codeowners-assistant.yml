name: P-055 CODEOWNERS Assistant acceptance

on:
  pull_request:
    paths:
      - 'scripts/p055_codeowners_assistant.py'
      - 'tests/test_p055_codeowners_assistant.py'
      - '.github/actions/codeowners-assistant/**'
      - '.github/workflows/p055-codeowners-assistant.yml'
      - 'docs/P055-CODEOWNERS*'
      - '.github/ISSUE_TEMPLATE/p055-codeowners-assistant.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/p055_codeowners_assistant.py'
      - 'tests/test_p055_codeowners_assistant.py'
      - '.github/actions/codeowners-assistant/**'
      - '.github/workflows/p055-codeowners-assistant.yml'
      - 'docs/P055-CODEOWNERS*'
      - '.github/ISSUE_TEMPLATE/p055-codeowners-assistant.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run adversarial P-055 tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'pytest>=8,<9'
          python -m pytest -q tests/test_p055_codeowners_assistant.py

      - name: Exercise valid and invalid GitHub-documented local boundaries
        run: |
          set -euo pipefail
          good="${RUNNER_TEMP}/p055-good"
          bad="${RUNNER_TEMP}/p055-bad"
          mkdir -p "$good/.github" "$bad/.github"
          printf '* @global-owner\n/.github/ @security-owner\n/docs/ @docs-owner\n' > "$good/.github/CODEOWNERS"
          printf '!secret/ @owner\nsrc/[ab].py @owner\n' > "$bad/.github/CODEOWNERS"
          python scripts/p055_codeowners_assistant.py --root "$good" --language en --out-dir "${RUNNER_TEMP}/p055-good-out" > /tmp/p055-good.json
          python scripts/p055_codeowners_assistant.py --root "$bad" --language es --out-dir "${RUNNER_TEMP}/p055-bad-out" > /tmp/p055-bad.json
          python - <<'PY'
          import json
          from pathlib import Path
          good=json.loads(Path('/tmp/p055-good.json').read_text())
          bad=json.loads(Path('/tmp/p055-bad.json').read_text())
          assert good['status']=='CODEOWNERS_LOCAL_BASELINE_READY'
          assert bad['status']=='CODEOWNERS_LOCAL_ERRORS'
          print('P055_VALID_FIXTURE=PASS')
          print('P055_INVALID_FIXTURE_FAILS_CLOSED=PASS')
          PY

  real-public-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout P-055 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: product
          persist-credentials: false

      - name: Checkout pinned real public consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AntonyMD7/learning-git
          ref: 01723a1825113de08810193f37e8047d978433c2
          path: consumer
          persist-credentials: false

      - name: Record consumer immutability baseline
        run: |
          set -euo pipefail
          test "$(git -C consumer rev-parse HEAD)" = '01723a1825113de08810193f37e8047d978433c2'
          sha256sum consumer/README.md > /tmp/p055-learning-before.sha256
          test "$(git -C consumer status --porcelain)" = ''

      - name: Run local P-055 Action against public consumer
        id: codeowners
        uses: ./product/.github/actions/codeowners-assistant
        with:
          root: consumer
          language: en

      - name: Repeat P-055 Action for deterministic evidence
        id: codeowners-again
        uses: ./product/.github/actions/codeowners-assistant
        with:
          root: consumer
          language: en

      - name: Verify read-only real-public truth boundary
        env:
          STATUS: ${{ steps.codeowners.outputs.status }}
          DIGEST: ${{ steps.codeowners.outputs.report-sha256 }}
          SECOND_DIGEST: ${{ steps.codeowners-again.outputs.report-sha256 }}
          REPORT: ${{ steps.codeowners.outputs.report-path }}
        run: |
          set -euo pipefail
          [[ "$STATUS" = CODEOWNERS_MISSING || "$STATUS" = CODEOWNERS_LOCAL_ERRORS || "$STATUS" = CODEOWNERS_NEEDS_REVIEW || "$STATUS" = CODEOWNERS_LOCAL_BASELINE_READY ]]
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$DIGEST" = "$SECOND_DIGEST"
          sha256sum --check /tmp/p055-learning-before.sha256
          test "$(git -C consumer status --porcelain)" = ''
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path(os.environ['REPORT']).read_text())
          assert report['roadmap_id']=='P-055'
          assert report['execution']['network_request_performed'] is False
          assert report['execution']['repository_mutation_performed'] is False
          assert report['execution']['repository_code_executed'] is False
          assert all(v is False for v in report['claims'].values())
          evidence={
            'schema_version':'1.0','evidence_type':'p055-source-real-public-readonly','roadmap_id':'P-055',
            'consumer_repository':'AntonyMD7/learning-git','consumer_commit':'01723a1825113de08810193f37e8047d978433c2',
            'status':os.environ['STATUS'],'report_sha256':os.environ['DIGEST'],
            'repeat_report_sha256':os.environ['SECOND_DIGEST'],'determinism':'PASS',
            'consumer_input_mutation_performed':False,'network_request_performed_by_product':False,
            'repository_code_executed_by_product':False,'github_server_syntax_verified':False,
            'owner_access_verified':False,'branch_protection_verified':False,
            'roadmap_completion_promoted':False
          }
          Path('product/p055-source-real-public-evidence.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print('P055_REAL_PUBLIC_READONLY=PASS')
          print('P055_DETERMINISM=PASS')
          print('P055_INPUT_MUTATION=NO')
          print('ROADMAP_COMPLETION_PROMOTED=FALSE')
          PY

      - name: Upload sanitized P-055 source acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p055-source-real-public-${{ github.run_id }}
          path: product/p055-source-real-public-evidence.json
          retention-days: 14
          if-no-files-found: error
