name: P-054 Contributor Onboarding Assistant completion audit

on:
  pull_request:
    paths:
      - 'examples/public-build-completion-p054-v0.9.1.json'
      - 'docs/P054-COMPLETION-RECORD-v0.9.1.md'
      - '.github/workflows/p054-completion.yml'
  push:
    branches: [main]
    paths:
      - 'examples/public-build-completion-p054-v0.9.1.json'
      - 'docs/P054-COMPLETION-RECORD-v0.9.1.md'
      - '.github/workflows/p054-completion.yml'

permissions:
  contents: read

jobs:
  completion-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout completion candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Re-run P-054 product tests and 19-gate completion audit
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'pytest>=8,<9'
          python -m pytest -q tests/test_p054_contributor_onboarding.py
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from public_build_completion_contract import audit_record
          p=Path('examples/public-build-completion-p054-v0.9.1.json')
          record=json.loads(p.read_text())
          report=audit_record(record)
          assert report['errors']==[]
          assert report['declared_status']=='COMPLETE'
          assert report['readiness']=='COMPLETE_CONTRACT_SATISFIED'
          assert report['completion_contract_satisfied'] is True
          assert report['blocking_gates']==[]
          assert report['gate_counts']['PASS']==19
          assert report['project_completion_record_populated'] is True
          assert report['safe_public_evidence_prefilter'] is True
          assert len(record['gates'])==19
          assert all(v['state']=='PASS' and v.get('applicability_reviewed') is True for v in record['gates'].values())
          Path('p054-final-contract-audit.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print('P054_19_GATE_COMPLETION_CONTRACT=PASS')
          PY

      - name: Independently verify public v0.9.1 release and retained evidence identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.9.1 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,name,publishedAt,url > p054-final-release.json
          git fetch --force "https://github.com/${GITHUB_REPOSITORY}.git" refs/tags/v0.9.1:refs/tags/v0.9.1
          resolved="$(git rev-list -n 1 v0.9.1)"
          test "$resolved" = '082b41527f016058ff8c199b43beaca3e716c390'
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31941584079" > p054-release-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31941584079/artifacts" > p054-release-artifacts.json
          python - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('p054-final-release.json').read_text())
          assert release['isDraft'] is False and release['isPrerelease'] is False
          assert release['tagName']=='v0.9.1'
          assert release['name']=='DAIS Contributor Onboarding Assistant v0.9.1'
          assert release['publishedAt']
          run=json.loads(Path('p054-release-run.json').read_text())
          assert run['id']==31941584079 and run['conclusion']=='success'
          assert run['head_sha']=='2a3481ffe8cea940d760969bc7f659be3a7f153f'
          artifacts=json.loads(Path('p054-release-artifacts.json').read_text())['artifacts']
          expected={
            'p054-v091-release-plan-31941584079':('9262164675','sha256:8def99b262f310d029dac29fbc403b07210375dc04d4ebfd56627e956f38c177'),
            'p054-v091-publication-31941584079':('9262166714','sha256:ea2faabe66b51f7c0469e06468155212c38f7eee52b041c648d610c16e9714e6'),
            'p054-v091-released-ref-consumer-31941584079':('9262168858','sha256:e8a472c555a4ce1651a03e03037a0cb2fa1c69ac8db3a6511b94bd0e2b7a5af7')
          }
          found={a['name']:(str(a['id']),a.get('digest')) for a in artifacts}
          for name,want in expected.items(): assert found.get(name)==want,(name,found.get(name),want)
          print('P054_FINAL_RELEASE_IDENTITY=PASS')
          print('P054_EXACT_RELEASE_SOURCE=PASS')
          print('P054_RELEASE_EVIDENCE_IDENTITY=PASS')
          PY

      - name: Checkout pinned real public consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AntonyMD7/learning-git
          ref: 01723a1825113de08810193f37e8047d978433c2
          path: consumer-learning-git
          persist-credentials: false

      - name: Record consumer immutability baseline
        run: |
          set -euo pipefail
          test "$(git -C consumer-learning-git rev-parse HEAD)" = '01723a1825113de08810193f37e8047d978433c2'
          sha256sum consumer-learning-git/README.md > /tmp/p054-final-learning-before.sha256
          test "$(git -C consumer-learning-git status --porcelain)" = ''

      - name: Freshly consume released P-054 in English
        id: onboarding-en
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/contributor-onboarding@v0.9.1
        with:
          root: consumer-learning-git
          language: en

      - name: Repeat released P-054 in English
        id: onboarding-en-again
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/contributor-onboarding@v0.9.1
        with:
          root: consumer-learning-git
          language: en

      - name: Freshly consume released P-054 in Spanish
        id: onboarding-es
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/contributor-onboarding@v0.9.1
        with:
          root: consumer-learning-git
          language: es

      - name: Require fresh released-ref acceptance and final attestation
        env:
          STATUS_EN: ${{ steps.onboarding-en.outputs.status }}
          STATUS_ES: ${{ steps.onboarding-es.outputs.status }}
          MISSING_EN: ${{ steps.onboarding-en.outputs.missing-required-count }}
          MISSING_ES: ${{ steps.onboarding-es.outputs.missing-required-count }}
          DIGEST_EN: ${{ steps.onboarding-en.outputs.report-sha256 }}
          DIGEST_EN_2: ${{ steps.onboarding-en-again.outputs.report-sha256 }}
          REPORT_EN: ${{ steps.onboarding-en.outputs.report-path }}
          REPORT_ES: ${{ steps.onboarding-es.outputs.report-path }}
          GUIDE_EN: ${{ steps.onboarding-en.outputs.guide-path }}
          GUIDE_ES: ${{ steps.onboarding-es.outputs.guide-path }}
        run: |
          set -euo pipefail
          test "$STATUS_EN" = "$STATUS_ES"
          test "$MISSING_EN" = "$MISSING_ES"
          test "$DIGEST_EN" = "$DIGEST_EN_2"
          test "$REPORT_EN" != "$REPORT_ES"
          test "$GUIDE_EN" != "$GUIDE_ES"
          sha256sum --check /tmp/p054-final-learning-before.sha256
          test "$(git -C consumer-learning-git status --porcelain)" = ''
          python - <<'PY'
          import json, os
          from pathlib import Path
          en=json.loads(Path(os.environ['REPORT_EN']).read_text())
          es=json.loads(Path(os.environ['REPORT_ES']).read_text())
          assert en['version']=='0.9.1' and es['version']=='0.9.1'
          assert en['language']=='en' and es['language']=='es'
          assert en['status']==es['status']==os.environ['STATUS_EN']
          assert en['missing_required']==es['missing_required']
          assert len(en['missing_required'])==int(os.environ['MISSING_EN'])
          assert en['execution']==es['execution']
          assert en['claims']==es['claims']
          for r in (en,es):
              assert r['execution']['network_request_performed'] is False
              assert r['execution']['repository_mutation_performed'] is False
              assert r['execution']['repository_code_executed'] is False
              assert r['claims']['github_community_profile_verified'] is False
              assert r['claims']['contributor_readiness_guaranteed'] is False
          assert Path(os.environ['GUIDE_EN']).read_text() != Path(os.environ['GUIDE_ES']).read_text()
          record=json.loads(Path('examples/public-build-completion-p054-v0.9.1.json').read_text())
          assert record['status']=='COMPLETE'
          attestation={
            'schema_version':'1.0','evidence_type':'p054-final-completion-audit','roadmap_id':'P-054',
            'release':'v0.9.1','released_source_commit':'082b41527f016058ff8c199b43beaca3e716c390',
            'release_control_commit':'2a3481ffe8cea940d760969bc7f659be3a7f153f',
            'consumer_repository':'AntonyMD7/learning-git','consumer_commit':'01723a1825113de08810193f37e8047d978433c2',
            'english_report_sha256':os.environ['DIGEST_EN'],'repeat_english_report_sha256':os.environ['DIGEST_EN_2'],
            'consumer_result':'PASS','determinism':'PASS','language_output_isolation':'PASS',
            'english_spanish_truth_state':'PASS','input_mutation_performed':False,
            'repository_mutation_performed':False,'network_request_performed_by_product':False,
            'github_community_profile_verified':False,'canonical_gate_count':19,'all_gates_pass':True,
            'v090_failure_retained':True,'flagship_completion_claimed':False,'adjacent_product_completion_claimed':False
          }
          Path('p054-final-completion-attestation.json').write_text(json.dumps(attestation,indent=2,sort_keys=True)+'\n')
          print('P054_FINAL_REAL_PUBLIC_CONSUMER=PASS')
          print('P054_FINAL_MULTILINGUAL_ISOLATION=PASS')
          print('P054_FINAL_DETERMINISM=PASS')
          print('P054_FINAL_INPUT_MUTATION=NO')
          PY

      - name: Retain sanitized final completion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p054-final-completion-${{ github.run_id }}
          path: |
            p054-final-contract-audit.json
            p054-final-release.json
            p054-release-run.json
            p054-release-artifacts.json
            p054-final-completion-attestation.json
          retention-days: 30
          if-no-files-found: error
