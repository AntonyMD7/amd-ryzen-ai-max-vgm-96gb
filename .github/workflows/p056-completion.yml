name: P-056 License Compliance Checker completion audit

on:
  pull_request:
    paths:
      - 'examples/public-build-completion-p056-v0.11.1.json'
      - 'docs/P056-COMPLETION-RECORD-v0.11.1.md'
      - '.github/workflows/p056-completion.yml'
  push:
    branches: [main]
    paths:
      - 'examples/public-build-completion-p056-v0.11.1.json'
      - 'docs/P056-COMPLETION-RECORD-v0.11.1.md'
      - '.github/workflows/p056-completion.yml'

permissions:
  contents: read
  actions: read

jobs:
  completion-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout completion candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Re-run P-056 product tests and 19-gate completion audit
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'pytest>=8,<9'
          python -m pytest -q tests/test_p056_license_compliance.py tests/test_p056_deterministic_evidence.py
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from public_build_completion_contract import audit_record
          p=Path('examples/public-build-completion-p056-v0.11.1.json')
          record=json.loads(p.read_text())
          report=audit_record(record)
          assert report['errors']==[]
          assert report['declared_status']=='COMPLETE'
          assert report['readiness']=='COMPLETE_CONTRACT_SATISFIED'
          assert report['completion_contract_satisfied'] is True
          assert report['blocking_gates']==[]
          assert report['gate_counts']['PASS']==19
          assert report['project_completion_record_populated'] is True
          assert report['safe_public_evidence_prefilter'] is True
          assert len(record['gates'])==19
          assert all(v['state']=='PASS' and v.get('applicability_reviewed') is True for v in record['gates'].values())
          Path('p056-final-contract-audit.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print('P056_19_GATE_COMPLETION_CONTRACT=PASS')
          PY

      - name: Independently verify public v0.11.1 release and retained evidence identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.11.1 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,name,publishedAt,url > p056-final-release.json
          git fetch --force "https://github.com/${GITHUB_REPOSITORY}.git" refs/tags/v0.11.1:refs/tags/v0.11.1
          resolved="$(git rev-list -n 1 v0.11.1)"
          test "$resolved" = 'a7b6dfa494e3fac6d7d20cab651b47f686e92495'
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31944984361" > p056-source-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31944984361/artifacts" > p056-source-artifacts.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31945119253" > p056-release-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31945119253/artifacts" > p056-release-artifacts.json
          python - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('p056-final-release.json').read_text())
          assert release['isDraft'] is False and release['isPrerelease'] is False
          assert release['tagName']=='v0.11.1'
          assert release['name']=='DAIS License Compliance Checker v0.11.1'
          assert release['publishedAt']=='2026-08-16T11:44:14Z'
          source=json.loads(Path('p056-source-run.json').read_text())
          assert source['id']==31944984361 and source['conclusion']=='success'
          assert source['head_sha']=='a7b6dfa494e3fac6d7d20cab651b47f686e92495'
          release_run=json.loads(Path('p056-release-run.json').read_text())
          assert release_run['id']==31945119253 and release_run['conclusion']=='success'
          assert release_run['head_sha']=='2ea56caa77c35d233aaa516ad9c86206ce578651'
          sarts={a['name']:(str(a['id']),a.get('digest')) for a in json.loads(Path('p056-source-artifacts.json').read_text())['artifacts']}
          assert sarts.get('p056-source-acceptance-31944984361')==('9263031133','sha256:d73f4d8357c375f0bc1a8d4ad0a916ca5adf219eaef9c6806ad04dcf3a3974f7')
          rarts={a['name']:(str(a['id']),a.get('digest')) for a in json.loads(Path('p056-release-artifacts.json').read_text())['artifacts']}
          expected={
            'p056-v0111-release-plan-31945119253':('9263061800','sha256:ce1972ce53a54e41efa7fd7f21bca90c61ad7cd9da48f97af565f998f6ac1cb1'),
            'p056-v0111-publication-31945119253':('9263064526','sha256:83c07dac7b17ea8bf4eb8e5260fec2316e8de8a240033a780334ea33509d4b68'),
            'p056-v0111-released-ref-31945119253':('9263069867','sha256:7c0ebc85443a51fc4227b40a8649f09307f4b0a279f909e1449985e928f92292')
          }
          for name,want in expected.items(): assert rarts.get(name)==want,(name,rarts.get(name),want)
          print('P056_FINAL_RELEASE_IDENTITY=PASS')
          print('P056_EXACT_RELEASE_SOURCE=PASS')
          print('P056_RELEASE_EVIDENCE_IDENTITY=PASS')
          PY

      - name: Checkout pinned real public consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AntonyMD7/learning-git
          ref: 01723a1825113de08810193f37e8047d978433c2
          path: consumer-learning-git
          persist-credentials: false

      - name: Record consumer immutability baseline
        run: |
          set -euo pipefail
          test "$(git -C consumer-learning-git rev-parse HEAD)" = '01723a1825113de08810193f37e8047d978433c2'
          sha256sum consumer-learning-git/README.md > /tmp/p056-final-learning-before.sha256
          test "$(git -C consumer-learning-git status --porcelain)" = ''

      - name: Freshly consume released P-056 in English
        id: en
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/license-compliance@v0.11.1
        with:
          root: consumer-learning-git
          language: en
          source-revision: 01723a1825113de08810193f37e8047d978433c2

      - name: Repeat released P-056 in English
        id: en2
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/license-compliance@v0.11.1
        with:
          root: consumer-learning-git
          language: en
          source-revision: 01723a1825113de08810193f37e8047d978433c2

      - name: Freshly consume released P-056 in Spanish
        id: es
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/license-compliance@v0.11.1
        with:
          root: consumer-learning-git
          language: es
          source-revision: 01723a1825113de08810193f37e8047d978433c2

      - name: Require provenance-scoped determinism, fresh released-ref acceptance and final attestation
        env:
          STATUS_EN: ${{ steps.en.outputs.status }}
          STATUS_ES: ${{ steps.es.outputs.status }}
          DIGEST_EN: ${{ steps.en.outputs.report-sha256 }}
          DIGEST_EN2: ${{ steps.en2.outputs.report-sha256 }}
          DIGEST_ES: ${{ steps.es.outputs.report-sha256 }}
          DEP_EN: ${{ steps.en.outputs.dependency-environment-sha256 }}
          DEP_EN2: ${{ steps.en2.outputs.dependency-environment-sha256 }}
          DEP_ES: ${{ steps.es.outputs.dependency-environment-sha256 }}
          RAW_EN: ${{ steps.en.outputs.raw-report-sha256 }}
          RAW_EN2: ${{ steps.en2.outputs.raw-report-sha256 }}
          RAW_ES: ${{ steps.es.outputs.raw-report-sha256 }}
          REPORT_EN: ${{ steps.en.outputs.report-path }}
          REPORT_ES: ${{ steps.es.outputs.report-path }}
          GUIDE_EN: ${{ steps.en.outputs.guide-path }}
          GUIDE_ES: ${{ steps.es.outputs.guide-path }}
        run: |
          set -euo pipefail
          test "$STATUS_EN" = 'REUSE_NONCOMPLIANT'
          test "$STATUS_EN" = "$STATUS_ES"
          test "$DEP_EN" = "$DEP_EN2"
          test "$DEP_EN" = "$DEP_ES"
          [[ "$DEP_EN" =~ ^[0-9a-f]{64}$ ]]
          test "$DIGEST_EN" = "$DIGEST_EN2"
          test "$DIGEST_EN" = "$DIGEST_ES"
          [[ "$DIGEST_EN" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RAW_EN" =~ ^[0-9a-f]{64}$ ]] && [[ "$RAW_EN2" =~ ^[0-9a-f]{64}$ ]] && [[ "$RAW_ES" =~ ^[0-9a-f]{64}$ ]]
          sha256sum --check /tmp/p056-final-learning-before.sha256
          test "$(git -C consumer-learning-git status --porcelain)" = ''
          python - <<'PY'
          import json, os
          from pathlib import Path
          en=json.loads(Path(os.environ['REPORT_EN']).read_text()); es=json.loads(Path(os.environ['REPORT_ES']).read_text())
          assert en==es
          assert en['roadmap_id']=='P-056' and en['product']['version']=='0.11.1'
          assert en['authority']['evidence_identity_profile']=='semantic-v1'
          assert en['authority']['dependency_environment_sha256']==os.environ['DEP_EN']
          assert en['source']['raw_reuse_report_sha256_in_deterministic_record'] is False
          assert 'raw_reuse_report_sha256' not in en['source']
          assert en['execution']['repository_mutation_performed'] is False
          assert en['execution']['audit_network_request_performed'] is False
          assert en['claims']['legal_permission_established'] is False
          assert en['claims']['license_compatibility_established'] is False
          assert en['claims']['dependency_license_safety_established'] is False
          assert Path(os.environ['GUIDE_EN']).read_text()!=Path(os.environ['GUIDE_ES']).read_text()
          assert 'README.md' not in json.dumps(en)
          record=json.loads(Path('examples/public-build-completion-p056-v0.11.1.json').read_text())
          assert record['status']=='COMPLETE'
          historical_dependency_environment_sha256='c8b712f7d6904b2e42a45dcd0b59dde7ffe1d2a2c4cd5f8550c58e2c7e7638bd'
          historical_semantic_report_sha256='9b1a820a49ff77f18b514d8ce424849e18454584e210d47081b41ac8ed72a593'
          attestation={
            'schema_version':'1.1','evidence_type':'p056-final-completion-audit','roadmap_id':'P-056',
            'release':'v0.11.1','released_source_commit':'a7b6dfa494e3fac6d7d20cab651b47f686e92495',
            'release_control_commit':'2ea56caa77c35d233aaa516ad9c86206ce578651',
            'consumer_repository':'AntonyMD7/learning-git','consumer_commit':'01723a1825113de08810193f37e8047d978433c2',
            'status':os.environ['STATUS_EN'],'fresh_dependency_environment_sha256':os.environ['DEP_EN'],
            'semantic_report_sha256':os.environ['DIGEST_EN'],'repeat_semantic_report_sha256':os.environ['DIGEST_EN2'],
            'spanish_semantic_report_sha256':os.environ['DIGEST_ES'],
            'raw_run_sha256_values':[os.environ['RAW_EN'],os.environ['RAW_EN2'],os.environ['RAW_ES']],
            'historical_release_acceptance':{
              'dependency_environment_sha256':historical_dependency_environment_sha256,
              'semantic_report_sha256':historical_semantic_report_sha256
            },
            'semantic_determinism_under_same_declared_provenance':'PASS',
            'cross_dependency_environment_digest_equality_claimed':False,
            'fully_hash_locked_transitive_dependency_closure_claimed':False,
            'multilingual_truth_state':'PASS','input_mutation_performed':False,
            'repository_mutation_performed':False,'product_network_request_performed':False,
            'legal_permission_claimed':False,'license_compatibility_claimed':False,
            'canonical_gate_count':19,'all_gates_pass':True,'flagship_completion_claimed':False,
            'adjacent_product_completion_claimed':False
          }
          Path('p056-final-completion-attestation.json').write_text(json.dumps(attestation,indent=2,sort_keys=True)+'\n')
          print('P056_FINAL_REAL_PUBLIC_CONSUMER=PASS')
          print('P056_FINAL_PROVENANCE_SCOPED_DETERMINISM=PASS')
          print('P056_FINAL_MULTILINGUAL_TRUTH=PASS')
          print('P056_FINAL_INPUT_MUTATION=NO')
          PY

      - name: Retain sanitized final completion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p056-final-completion-${{ github.run_id }}
          path: |
            p056-final-contract-audit.json
            p056-final-release.json
            p056-source-run.json
            p056-source-artifacts.json
            p056-release-run.json
            p056-release-artifacts.json
            p056-final-completion-attestation.json
          retention-days: 30
          if-no-files-found: error
