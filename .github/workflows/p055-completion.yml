name: P-055 CODEOWNERS Assistant completion audit

on:
  pull_request:
    paths:
      - 'examples/public-build-completion-p055-v0.10.0.json'
      - 'docs/P055-COMPLETION-RECORD-v0.10.0.md'
      - '.github/workflows/p055-completion.yml'
  push:
    branches: [main]
    paths:
      - 'examples/public-build-completion-p055-v0.10.0.json'
      - 'docs/P055-COMPLETION-RECORD-v0.10.0.md'
      - '.github/workflows/p055-completion.yml'

permissions:
  contents: read

jobs:
  completion-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout completion candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Re-run P-055 product tests and 19-gate completion audit
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'pytest>=8,<9'
          python -m pytest -q tests/test_p055_codeowners_assistant.py
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from public_build_completion_contract import audit_record
          p=Path('examples/public-build-completion-p055-v0.10.0.json')
          record=json.loads(p.read_text())
          report=audit_record(record)
          assert report['errors']==[]
          assert report['declared_status']=='COMPLETE'
          assert report['readiness']=='COMPLETE_CONTRACT_SATISFIED'
          assert report['completion_contract_satisfied'] is True
          assert report['blocking_gates']==[]
          assert report['gate_counts']['PASS']==19
          assert report['project_completion_record_populated'] is True
          assert report['safe_public_evidence_prefilter'] is True
          assert len(record['gates'])==19
          assert all(v['state']=='PASS' and v.get('applicability_reviewed') is True for v in record['gates'].values())
          Path('p055-final-contract-audit.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print('P055_19_GATE_COMPLETION_CONTRACT=PASS')
          PY

      - name: Independently verify public v0.10.0 release and retained evidence identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.10.0 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,name,publishedAt,url > p055-final-release.json
          git fetch --force "https://github.com/${GITHUB_REPOSITORY}.git" refs/tags/v0.10.0:refs/tags/v0.10.0
          resolved="$(git rev-list -n 1 v0.10.0)"
          test "$resolved" = '0615eaba32c9fe15a95230f61947694341cc4f89'
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31942717484" > p055-release-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31942717484/artifacts" > p055-release-artifacts.json
          python - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('p055-final-release.json').read_text())
          assert release['isDraft'] is False and release['isPrerelease'] is False
          assert release['tagName']=='v0.10.0'
          assert release['name']=='DAIS CODEOWNERS Assistant v0.10.0'
          assert release['publishedAt']=='2026-08-16T10:50:38Z'
          run=json.loads(Path('p055-release-run.json').read_text())
          assert run['id']==31942717484 and run['conclusion']=='success'
          assert run['head_sha']=='e52bd6981ad78031ac8c0063632bff45b8fe0d9e'
          artifacts=json.loads(Path('p055-release-artifacts.json').read_text())['artifacts']
          expected={
            'p055-v0100-release-plan-31942717484':('9262449681','sha256:1676056b5a986efcae27a3be0aac7932f71141a9154aaf15e127a4a666a2bb3b'),
            'p055-v0100-publication-31942717484':('9262452101','sha256:f4ca1c3a3cc4133aa7a473f256fefb22a571f576389bdb3219da689f06da39a0'),
            'p055-v0100-released-ref-consumer-31942717484':('9262454273','sha256:1b87ecb01ac7ea09fd069687f3525d4b8cd0338328270780f58e3b21f7637f27')
          }
          found={a['name']:(str(a['id']),a.get('digest')) for a in artifacts}
          for name,want in expected.items(): assert found.get(name)==want,(name,found.get(name),want)
          print('P055_FINAL_RELEASE_IDENTITY=PASS')
          print('P055_EXACT_RELEASE_SOURCE=PASS')
          print('P055_RELEASE_EVIDENCE_IDENTITY=PASS')
          PY

      - name: Checkout pinned real public consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AntonyMD7/learning-git
          ref: 01723a1825113de08810193f37e8047d978433c2
          path: consumer-learning-git
          persist-credentials: false

      - name: Record consumer immutability baseline
        run: |
          set -euo pipefail
          test "$(git -C consumer-learning-git rev-parse HEAD)" = '01723a1825113de08810193f37e8047d978433c2'
          sha256sum consumer-learning-git/README.md > /tmp/p055-final-learning-before.sha256
          test "$(git -C consumer-learning-git status --porcelain)" = ''

      - name: Freshly consume released P-055 in English
        id: codeowners-en
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/codeowners-assistant@v0.10.0
        with:
          root: consumer-learning-git
          language: en

      - name: Repeat released P-055 in English
        id: codeowners-en-again
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/codeowners-assistant@v0.10.0
        with:
          root: consumer-learning-git
          language: en

      - name: Freshly consume released P-055 in Spanish
        id: codeowners-es
        uses: AntonyMD7/amd-ryzen-ai-max-vgm-96gb/.github/actions/codeowners-assistant@v0.10.0
        with:
          root: consumer-learning-git
          language: es

      - name: Require fresh released-ref acceptance and final attestation
        env:
          STATUS_EN: ${{ steps.codeowners-en.outputs.status }}
          STATUS_ES: ${{ steps.codeowners-es.outputs.status }}
          FINDINGS_EN: ${{ steps.codeowners-en.outputs.finding-count }}
          FINDINGS_ES: ${{ steps.codeowners-es.outputs.finding-count }}
          DIGEST_EN: ${{ steps.codeowners-en.outputs.report-sha256 }}
          DIGEST_EN_2: ${{ steps.codeowners-en-again.outputs.report-sha256 }}
          DIGEST_ES: ${{ steps.codeowners-es.outputs.report-sha256 }}
          REPORT_EN: ${{ steps.codeowners-en.outputs.report-path }}
          REPORT_ES: ${{ steps.codeowners-es.outputs.report-path }}
          GUIDE_EN: ${{ steps.codeowners-en.outputs.guide-path }}
          GUIDE_ES: ${{ steps.codeowners-es.outputs.guide-path }}
        run: |
          set -euo pipefail
          test "$STATUS_EN" = "$STATUS_ES"
          test "$FINDINGS_EN" = "$FINDINGS_ES"
          test "$DIGEST_EN" = "$DIGEST_EN_2"
          test "$DIGEST_EN" = "$DIGEST_ES"
          test "$REPORT_EN" != "$REPORT_ES"
          test "$GUIDE_EN" != "$GUIDE_ES"
          sha256sum --check /tmp/p055-final-learning-before.sha256
          test "$(git -C consumer-learning-git status --porcelain)" = ''
          python - <<'PY'
          import json, os
          from pathlib import Path
          en=json.loads(Path(os.environ['REPORT_EN']).read_text())
          es=json.loads(Path(os.environ['REPORT_ES']).read_text())
          assert en==es
          assert en['roadmap_id']=='P-055'
          assert en['product']['version']=='0.10.0'
          assert en['status']==os.environ['STATUS_EN']
          assert len(en['findings'])==int(os.environ['FINDINGS_EN'])
          assert en['execution']['network_request_performed'] is False
          assert en['execution']['repository_mutation_performed'] is False
          assert en['execution']['repository_code_executed'] is False
          assert en['execution']['subprocess_executed'] is False
          for key in ('github_server_syntax_verified','owner_identity_or_write_access_verified','branch_protection_verified','code_owner_review_requirement_verified','comprehensive_repository_coverage_proven','repository_security_guaranteed'):
              assert en['claims'][key] is False
          assert Path(os.environ['GUIDE_EN']).read_text() != Path(os.environ['GUIDE_ES']).read_text()
          record=json.loads(Path('examples/public-build-completion-p055-v0.10.0.json').read_text())
          assert record['status']=='COMPLETE'
          attestation={
            'schema_version':'1.0','evidence_type':'p055-final-completion-audit','roadmap_id':'P-055',
            'release':'v0.10.0','released_source_commit':'0615eaba32c9fe15a95230f61947694341cc4f89',
            'release_control_commit':'e52bd6981ad78031ac8c0063632bff45b8fe0d9e',
            'consumer_repository':'AntonyMD7/learning-git','consumer_commit':'01723a1825113de08810193f37e8047d978433c2',
            'english_report_sha256':os.environ['DIGEST_EN'],'repeat_english_report_sha256':os.environ['DIGEST_EN_2'],
            'spanish_report_sha256':os.environ['DIGEST_ES'],'consumer_result':'PASS','determinism':'PASS',
            'language_output_isolation':'PASS','english_spanish_truth_state':'PASS','input_mutation_performed':False,
            'repository_mutation_performed':False,'network_request_performed_by_product':False,
            'github_server_syntax_verified':False,'owner_identity_or_write_access_verified':False,
            'branch_protection_verified':False,'code_owner_review_requirement_verified':False,
            'canonical_gate_count':19,'all_gates_pass':True,'flagship_completion_claimed':False,
            'adjacent_product_completion_claimed':False
          }
          Path('p055-final-completion-attestation.json').write_text(json.dumps(attestation,indent=2,sort_keys=True)+'\n')
          print('P055_FINAL_REAL_PUBLIC_CONSUMER=PASS')
          print('P055_FINAL_MULTILINGUAL_TRUTH=PASS')
          print('P055_FINAL_DETERMINISM=PASS')
          print('P055_FINAL_INPUT_MUTATION=NO')
          PY

      - name: Retain sanitized final completion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p055-final-completion-${{ github.run_id }}
          path: |
            p055-final-contract-audit.json
            p055-final-release.json
            p055-release-run.json
            p055-release-artifacts.json
            p055-final-completion-attestation.json
          retention-days: 30
          if-no-files-found: error
