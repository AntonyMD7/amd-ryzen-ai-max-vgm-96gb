name: System Doctor Universal Evidence binding

on:
  push:

permissions:
  contents: read
  id-token: write

jobs:
  bind-validate-sign:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded validation dependencies
        run: python -m pip install --disable-pip-version-check 'psutil==7.2.2' 'jsonschema>=4.23,<5' 'pytest>=8,<9'

      - name: Run F-02/F-05 binding contract tests
        run: python -m pytest -q tests/test_system_doctor_psutil_adapter.py tests/test_system_doctor_universal_evidence.py

      - name: Produce real bounded F-02 hosted acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p f02-f05/input f02-f05/bound
          python scripts/system_doctor_psutil_adapter.py --output f02-f05/input/psutil-acceptance.json
          echo 'F02_REAL_BOUNDED_ACCEPTANCE=PASS'
          echo 'PRODUCTION_SAFE_TO_INFER=FALSE'

      - name: Bind exact F-02 artifacts into Universal Evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_id="f02-f05-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/system_doctor_universal_evidence.py \
            f02-f05/input/psutil-acceptance.json \
            --output-dir f02-f05/bound \
            --source-commit "$GITHUB_SHA" \
            --evidence-id "$evidence_id" \
            > f02-f05/binding-result.json
          test -s f02-f05/bound/universal-evidence.json
          echo 'F02_F05_BINDING=PASS'

      - name: Validate Universal Evidence schema and exact artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/evidence_validate.py \
            f02-f05/bound/universal-evidence.json \
            --artifact-root f02-f05/bound \
            > f02-f05/evidence-validation.json
          grep -q '"status": "PASS"' f02-f05/evidence-validation.json
          grep -q '"artifacts_executed": false' f02-f05/evidence-validation.json
          touch f02-f05/evidence-validation.ok
          echo 'UNIVERSAL_EVIDENCE_SCHEMA_AND_HASHES=PASS'

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Keyless-sign exact bound Universal Evidence
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "https://github.com/${GITHUB_WORKFLOW_REF}" > f02-f05/expected-identity.txt
          printf '%s\n' 'https://token.actions.githubusercontent.com' > f02-f05/expected-issuer.txt
          sha256sum f02-f05/bound/universal-evidence.json > f02-f05/universal-evidence.sha256
          cosign sign-blob \
            --yes \
            --bundle f02-f05/universal-evidence.sigstore.json \
            f02-f05/bound/universal-evidence.json \
            > f02-f05/sign.txt
          test -s f02-f05/universal-evidence.sigstore.json
          touch f02-f05/sign.ok
          echo 'F02_F05_KEYLESS_SIGNING=PASS'
          echo 'PRODUCTION_CREDENTIAL_USED=FALSE'

      - name: Verify exact workflow identity and issuer
        shell: bash
        run: |
          set -euo pipefail
          identity="$(cat f02-f05/expected-identity.txt)"
          issuer="$(cat f02-f05/expected-issuer.txt)"
          cosign verify-blob \
            f02-f05/bound/universal-evidence.json \
            --bundle f02-f05/universal-evidence.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            > f02-f05/verify-exact.txt
          touch f02-f05/verify-exact.ok
          echo 'F02_F05_EXACT_WORKFLOW_IDENTITY=PASS'

      - name: Require transparency and signed timestamp material
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('f02-f05')
          bundle = json.loads((root / 'universal-evidence.sigstore.json').read_text(encoding='utf-8'))
          material = bundle.get('verificationMaterial') or {}
          tlog = material.get('tlogEntries') or []
          timestamp_data = material.get('timestampVerificationData') or {}
          timestamps = timestamp_data.get('rfc3161Timestamps') or []
          inspection = {
              'media_type': bundle.get('mediaType'),
              'tlog_entry_count': len(tlog),
              'rfc3161_timestamp_count': len(timestamps),
              'artifact_goodness_proven': False,
              'diagnostic_truth_proven': False,
              'production_safe_to_infer': False,
          }
          (root / 'bundle-inspection.json').write_text(json.dumps(inspection, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          if bundle.get('mediaType') != 'application/vnd.dev.sigstore.bundle.v0.3+json':
              raise SystemExit('unexpected Sigstore bundle media type')
          if not tlog:
              raise SystemExit('missing transparency-log material')
          if not timestamps:
              raise SystemExit('missing RFC3161 timestamp material')
          (root / 'trust-material.ok').touch()
          print('TRANSPARENCY_TIMESTAMP_MATERIAL=PASS')
          PY

      - name: Prove wrong identity and tampered evidence fail closed
        shell: bash
        run: |
          set -euo pipefail
          issuer="$(cat f02-f05/expected-issuer.txt)"
          if cosign verify-blob \
            f02-f05/bound/universal-evidence.json \
            --bundle f02-f05/universal-evidence.sigstore.json \
            --certificate-identity 'https://github.com/example/incorrect/.github/workflows/incorrect.yml@refs/heads/main' \
            --certificate-oidc-issuer "$issuer" \
            > f02-f05/wrong-identity.txt 2>&1; then
            echo 'Wrong signer identity unexpectedly verified.' >&2
            exit 1
          fi
          cp f02-f05/bound/universal-evidence.json f02-f05/universal-evidence-tampered.json
          printf '\n' >> f02-f05/universal-evidence-tampered.json
          if cosign verify-blob \
            f02-f05/universal-evidence-tampered.json \
            --bundle f02-f05/universal-evidence.sigstore.json \
            --certificate-identity "$(cat f02-f05/expected-identity.txt)" \
            --certificate-oidc-issuer "$issuer" \
            > f02-f05/tampered.txt 2>&1; then
            echo 'Tampered Universal Evidence unexpectedly verified.' >&2
            exit 1
          fi
          touch f02-f05/negative-controls.ok
          echo 'F02_F05_WRONG_IDENTITY_REJECTION=PASS'
          echo 'F02_F05_TAMPER_REJECTION=PASS'

      - name: Evaluate existing exact F-05 trust policy against bound evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('f02-f05')
          artifact = root / 'bound' / 'universal-evidence.json'
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          identity = (root / 'expected-identity.txt').read_text(encoding='utf-8').strip()
          issuer = (root / 'expected-issuer.txt').read_text(encoding='utf-8').strip()
          exact = (root / 'verify-exact.ok').exists()
          trust_material = (root / 'trust-material.ok').exists()
          profile = {
              'schema_version': '0.1',
              'profile_id': 'f02-system-doctor-github-actions-keyless-v0.1',
              'artifact': {'sha256': digest},
              'signer': {
                  'mode': 'SIGSTORE_KEYLESS',
                  'exact_identity': identity,
                  'exact_oidc_issuer': issuer,
              },
              'transparency': {'required': True},
              'timestamp': {'required': True, 'accepted_sources': ['SIGSTORE_TSA']},
              'provenance': {'builder_id_required': False, 'allowed_builder_ids': []},
              'claims': {'artifact_goodness_inferred': False, 'semantic_truth_inferred': False},
          }
          observation = {
              'artifact_sha256': digest,
              'cryptographic_signature_verified': exact,
              'certificate_identity': identity,
              'certificate_oidc_issuer': issuer,
              'transparency_verified': exact and trust_material,
              'timestamp_verified': exact and trust_material,
              'timestamp_source': 'SIGSTORE_TSA' if trust_material else None,
              'provenance_verified': False,
              'builder_id': None,
              'verifier': 'cosign-v3.0.6-f02-f05-binding',
          }
          (root / 'trust-profile.json').write_text(json.dumps(profile, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          (root / 'verifier-observation.json').write_text(json.dumps(observation, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          python scripts/evidence_trust_policy.py \
            f02-f05/trust-profile.json \
            f02-f05/verifier-observation.json \
            > f02-f05/trust-policy-result.json
          grep -q '"policy_status": "POLICY_SATISFIED"' f02-f05/trust-policy-result.json
          grep -q '"artifact_goodness_proven": false' f02-f05/trust-policy-result.json
          grep -q '"semantic_truth_proven": false' f02-f05/trust-policy-result.json
          echo 'F02_F05_EXACT_TRUST_POLICY=PASS'

      - name: Write fail-honest binding acceptance summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('f02-f05')
          record = {
              'schema_version': '0.1',
              'f02_bounded_acceptance_present': (root / 'input' / 'psutil-acceptance.json').is_file(),
              'universal_evidence_validation_passed': (root / 'evidence-validation.ok').exists(),
              'keyless_signing_completed': (root / 'sign.ok').exists(),
              'exact_workflow_identity_verified': (root / 'verify-exact.ok').exists(),
              'transparency_and_timestamp_material_present': (root / 'trust-material.ok').exists(),
              'negative_controls_passed': (root / 'negative-controls.ok').exists(),
              'diagnostic_truth_proven': False,
              'hardware_health_proven': False,
              'repair_authorized': False,
              'production_safe_to_infer': False,
              'f02_complete': False,
              'f05_complete': False,
              'roadmap_complete': False,
          }
          (root / 'acceptance-summary.json').write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          required = (
              'f02_bounded_acceptance_present',
              'universal_evidence_validation_passed',
              'keyless_signing_completed',
              'exact_workflow_identity_verified',
              'transparency_and_timestamp_material_present',
              'negative_controls_passed',
          )
          if not all(record[key] for key in required):
              raise SystemExit('one or more F-02/F-05 binding acceptance gates failed')
          print('F02_F05_SIGNED_BINDING_ACCEPTANCE=PASS')
          print('DIAGNOSTIC_TRUTH_PROVEN=FALSE')
          print('ROADMAP_COMPLETE=FALSE')
          PY

      - name: Upload sanitized binding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f02-f05-evidence-binding-${{ github.run_id }}
          path: |
            f02-f05/bound/*.json
            f02-f05/evidence-validation.json
            f02-f05/universal-evidence.sha256
            f02-f05/universal-evidence.sigstore.json
            f02-f05/bundle-inspection.json
            f02-f05/trust-profile.json
            f02-f05/verifier-observation.json
            f02-f05/trust-policy-result.json
            f02-f05/acceptance-summary.json
          if-no-files-found: warn
          retention-days: 14
