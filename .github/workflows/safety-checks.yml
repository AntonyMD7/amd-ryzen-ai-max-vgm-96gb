name: Safety checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check 'jsonschema>=4.23,<5' 'pytest>=8,<9'

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Validate all public-build foundation contracts
        run: python -m pytest -q

      - name: SafeFix disposable sandbox acceptance
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          printf 'acceptance only\n' > "$root/.safefix-sandbox"
          printf 'before\n' > "$root/config.txt"
          SAFEFIX_SANDBOX_ROOT="$root" python - <<'PY'
          import hashlib
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from safefix_sandbox import apply_text_change, rollback

          root = Path(os.environ['SAFEFIX_SANDBOX_ROOT'])
          before = (root / 'config.txt').read_bytes()
          digest = hashlib.sha256(before).hexdigest()
          changed = apply_text_change(
              root,
              'config.txt',
              'after\n',
              transaction_id='ci-safefix-acceptance',
              approval_present=True,
              expected_before_sha256=digest,
          )
          assert changed['status'] == 'MUTATION_ATTESTED'
          assert changed['production_safe_to_infer'] is False
          restored = rollback(root, 'config.txt', transaction_id='ci-safefix-acceptance')
          assert restored['status'] == 'ROLLBACK_ATTESTED'
          assert (root / 'config.txt').read_bytes() == before
          print('SAFEFIX_SANDBOX_ACCEPTANCE=PASS')
          print('PRODUCTION_SAFE_TO_INFER=FALSE')
          PY

      - name: Local AI Doctor synthetic integration acceptance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/local_ai_doctor.py examples/local-ai-doctor-synthetic.json > /tmp/local-ai-doctor.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/local-ai-doctor.json').read_text(encoding='utf-8'))
          assert data['doctor']['mode'] == 'PLAN_ONLY'
          assert data['status'] == 'EXACT_BACKEND_WORKLOAD_ACCEPTANCE_REQUIRED'
          assert data['memory_prefilter']['fit_status'] == 'PREFILTER_FIT_REQUIRES_BACKEND_VALIDATION'
          assert data['architecture_prefilter']['recommended_lane'] == 'LOCAL_ONLY_REQUIRED'
          assert all(value is False for value in data['claims'].values())
          assert all(value is False for value in data['safety'].values())
          print('LOCAL_AI_DOCTOR_SYNTHETIC_ACCEPTANCE=PASS')
          print('MODEL_RUNNABLE_CLAIMED=FALSE')
          print('PRODUCTION_READY_CLAIMED=FALSE')
          PY

      - name: Hardware Compatibility Commons synthetic public-intake acceptance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/hardware_compatibility_intake.py examples/hardware-compatibility-synthetic-v0.2.json > /tmp/hcc-intake.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/hcc-intake.json').read_text(encoding='utf-8'))
          assert data['status'] == 'ELIGIBLE_FOR_PUBLIC_REVIEW_NOT_VERIFIED'
          assert data['schema_validation'] == 'PASS'
          assert data['privacy_prefilter'] == 'PASS'
          assert data['semantic_claim_check'] == 'PASS'
          assert data['compatibility_verified_by_intake'] is False
          assert data['human_review_completed_by_intake'] is False
          assert data['safe_to_auto_apply'] is False
          print('HCC_PUBLIC_INTAKE_ACCEPTANCE=PASS')
          print('COMPATIBILITY_VERIFIED_BY_INTAKE=FALSE')
          PY

      - name: Render example runbook without execution
        run: |
          python scripts/runbook_generator.py examples/automation-plan-readonly-v0.1.json --output /tmp/read-only-runbook.md
          grep -q 'does \*\*not\*\* prove' /tmp/read-only-runbook.md
          grep -q 'Secret values allowed in evidence: \*\*NO\*\*' /tmp/read-only-runbook.md

      - name: Enforce read-only probe contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/vgm_readonly_probe.py')
          text = p.read_text(encoding='utf-8')
          for required in ('SETOPTION_BOUND=FALSE', 'SETOPTION_CALLED=FALSE', 'VGM_CHANGED=FALSE'):
              if required not in text:
                  raise SystemExit(f'missing read-only marker: {required}')
          forbidden = ('dll.SetOption', '.SetOption(', 'getattr(dll, "SetOption"', "getattr(dll, 'SetOption'")
          hits = [token for token in forbidden if token in text]
          if hits:
              raise SystemExit(f'read-only safety contract violated: {hits}')
          print('READ_ONLY_CONTRACT=PASS')
          PY

      - name: Verify required safety documentation and foundation artifacts
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            START-HERE.md \
            docs/BEGINNER-GUIDE.md \
            docs/ARCHITECTURE.md \
            docs/RECOVERY.md \
            docs/TROUBLESHOOTING.md \
            docs/COMMUNITY-SAFETY.md \
            docs/COMPATIBILITY.md \
            docs/PUBLIC-BUILD-FOUNDATIONS.md \
            docs/SAFEFIX-SANDBOX-ACCEPTANCE.md \
            docs/LOCAL-AI-DOCTOR-ORCHESTRATION.md \
            docs/HARDWARE-COMPATIBILITY-COMMONS-INTAKE.md \
            docs/SYSTEM-DOCTOR-AND-ACCESSIBLE-AI.md \
            docs/BEGINNER-TECH-RESCUE.md \
            docs/EVIDENCE-FIRST-RUNBOOKS.md \
            SECURITY.md \
            CONTRIBUTING.md \
            scripts/safefix_contract.py \
            scripts/safefix_sandbox.py \
            scripts/local_ai_readiness.py \
            scripts/local_ai_doctor.py \
            scripts/hardware_compatibility_intake.py \
            scripts/system_doctor.py \
            scripts/accessible_report.py \
            scripts/safe_command_explainer.py \
            scripts/error_message_explainer.py \
            scripts/beginner_tech_rescue.py \
            scripts/runbook_generator.py \
            schemas/universal-evidence-v0.1.schema.json \
            schemas/hardware-compatibility-report-v0.1.schema.json \
            schemas/hardware-compatibility-report-v0.2.schema.json \
            schemas/automation-plan-v0.1.schema.json \
            examples/universal-evidence-readonly-example.json \
            examples/automation-plan-readonly-v0.1.json \
            examples/local-ai-doctor-synthetic.json \
            examples/hardware-compatibility-synthetic-v0.2.json; do
              test -s "$f" || { echo "Missing required file: $f" >&2; exit 1; }
          done

      - name: Guard terminology
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git -E 'upgrade (from )?64 ?GB RAM to 96 ?GB RAM' .; then
            echo 'Misleading physical-RAM terminology detected.' >&2
            exit 1
          fi
