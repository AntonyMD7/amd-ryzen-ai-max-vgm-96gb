name: P-050 completion v0.3.0

on:
  pull_request:
    paths:
      - '.github/workflows/p050-completion-v0.3.0.yml'
      - 'examples/public-build-completion-p050-v0.3.0.json'
      - 'docs/P050-COMPLETION-RECORD-v0.3.0.md'
      - 'docs/DAIS-PUBLIC-BUILD-STATUS.md'
      - 'tests/test_p050_completion_record.py'
      - 'scripts/public_build_completion_contract.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/p050-completion-v0.3.0.yml'
      - 'examples/public-build-completion-p050-v0.3.0.json'
      - 'docs/P050-COMPLETION-RECORD-v0.3.0.md'
      - 'docs/DAIS-PUBLIC-BUILD-STATUS.md'
      - 'tests/test_p050_completion_record.py'
      - 'scripts/public_build_completion_contract.py'

permissions:
  contents: read
  actions: read

jobs:
  independent-completion-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed completion source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run completion-record regressions
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'pytest>=8,<9'
          python -m pytest -q tests/test_public_build_completion_contract.py tests/test_p050_completion_record.py

      - name: Audit canonical P-050 completion record independently
        run: |
          set -euo pipefail
          python scripts/public_build_completion_contract.py examples/public-build-completion-p050-v0.3.0.json > p050-completion-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('p050-completion-audit.json').read_text(encoding='utf-8'))
          assert d['subject_id'] == 'P-050'
          assert d['errors'] == []
          assert d['readiness'] == 'COMPLETE_CONTRACT_SATISFIED'
          assert d['completion_contract_satisfied'] is True
          assert d['blocking_gates'] == []
          assert d['gate_counts']['PASS'] == 19
          assert d['project_completion_record_populated'] is True
          assert d['safe_public_evidence_prefilter'] is True
          print('P050_COMPLETION_CONTRACT=PASS')
          PY

      - name: Independently verify public v0.3.0 release and exact source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SOURCE: f00ad749a07a9067075c87f5ca20feab04695288
        run: |
          set -euo pipefail
          gh release view v0.3.0 --repo "$REPO" --json isDraft,isPrerelease,tagName,name,targetCommitish,publishedAt,url > p050-release-verification.json
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          expected = os.environ['EXPECTED_SOURCE']
          repo = os.environ['REPO']
          release = json.loads(Path('p050-release-verification.json').read_text(encoding='utf-8'))
          assert release['isDraft'] is False
          assert release['isPrerelease'] is False
          assert release['tagName'] == 'v0.3.0'
          assert release['name'] == 'DAIS Evidence Validation Action v0.3.0'
          assert release['targetCommitish'] == expected
          assert release['publishedAt']
          raw = subprocess.check_output(
              ['git','ls-remote','--tags',f'https://github.com/{repo}.git','refs/tags/v0.3.0'],
              text=True,
          ).strip()
          parts = raw.split()
          assert len(parts) == 2, raw
          assert parts[0] == expected, (parts[0], expected)
          out = {
              'schema_version': '1.0',
              'claim': 'P050_PUBLIC_RELEASE_INDEPENDENT_VERIFICATION',
              'release_tag': 'v0.3.0',
              'expected_source': expected,
              'resolved_public_tag_source': parts[0],
              'release_target_commitish': release['targetCommitish'],
              'published_at': release['publishedAt'],
              'release_url': release['url'],
              'exact_public_identity_verified': True,
              'roadmap_completion_inferred_from_release_alone': False,
          }
          Path('p050-public-release-evidence.json').write_text(json.dumps(out, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          print('P050_PUBLIC_V0_3_0_EXACT_SOURCE=PASS')
          PY

      - name: Independently verify the two released-ref consumer jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_RUN: '31929278253'
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$RELEASE_RUN/jobs?per_page=100" > p050-release-run-jobs.json
          gh api "repos/$REPO/actions/runs/$RELEASE_RUN/artifacts?per_page=100" > p050-release-run-artifacts.json
          python - <<'PY'
          import json
          from pathlib import Path
          jobs = json.loads(Path('p050-release-run-jobs.json').read_text(encoding='utf-8'))['jobs']
          by_name = {j['name']: j for j in jobs}
          required = {
              'Validate P-050 exact-source release control',
              'Publish exact-source P-050 v0.3.0',
              'Released-ref consumer — learning-git',
              'Released-ref consumer — Kimi-Haul',
              'Require both independent public consumers',
          }
          assert required <= set(by_name), sorted(by_name)
          for name in required:
              assert by_name[name]['status'] == 'completed', (name, by_name[name]['status'])
              assert by_name[name]['conclusion'] == 'success', (name, by_name[name]['conclusion'])

          artifacts = json.loads(Path('p050-release-run-artifacts.json').read_text(encoding='utf-8'))['artifacts']
          observed = {a['id']: a for a in artifacts}
          expected = {
              9258798897: 'sha256:85550a3554671c8bc5267b6aeba5b3b0e9f7c0341cb2b27910be3f4be5cf826e',
              9258800798: 'sha256:739031f7b298a3bd50378964dbf0e322e00bd0449e17841e205e945ff19f324c',
              9258802973: 'sha256:48415009559fe7c21a30875dc341562a97fcc8418bdc0c62f09f34efb7e33055',
              9258802825: 'sha256:d88308a8ef0142ed809deef1d3ed227ce0bc4dc92ee150f4dff2fdeeb80e9588',
          }
          for artifact_id, digest in expected.items():
              assert artifact_id in observed, artifact_id
              assert observed[artifact_id].get('expired') is False
              assert observed[artifact_id].get('digest') == digest, (artifact_id, observed[artifact_id].get('digest'), digest)
          print('P050_RELEASED_CONSUMERS_2_OF_2=PASS')
          print('P050_RETAINED_EVIDENCE_IDENTITIES=PASS')
          PY

      - name: Prove exact released source remains retained
        run: |
          set -euo pipefail
          git cat-file -e 'f00ad749a07a9067075c87f5ca20feab04695288^{commit}'
          echo 'P050_RELEASED_PRODUCT_SOURCE_RETAINED=PASS'

      - name: Verify public ledger promotion is exactly one project
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('docs/DAIS-PUBLIC-BUILD-STATUS.md').read_text(encoding='utf-8')
          assert '| COMPLETE | **4** |' in text
          assert '| IN PROGRESS | **223** |' in text
          assert '**P-050** | **COMPLETE v0.3.0' in text
          assert 'All six flagships remain **IN PROGRESS**' in text
          print('P050_PORTFOLIO_PROMOTION_BOUNDARY=PASS')
          PY

      - name: Retain sanitized independent completion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p050-completion-v0.3.0-${{ github.run_id }}
          path: |
            p050-completion-audit.json
            p050-release-verification.json
            p050-public-release-evidence.json
            p050-release-run-jobs.json
            p050-release-run-artifacts.json
          retention-days: 30
          if-no-files-found: error
