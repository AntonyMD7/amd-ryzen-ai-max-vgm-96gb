name: P-053 Issue Template Generator support
description: Report a reproducible P-053 generator problem using only public or synthetic information.
title: '[P-053] '
body:
  - type: markdown
    attributes:
      value: |
        Do not paste credentials, private repository content, personal/medical data, private network details, or sensitive issue content. Use a minimal public/synthetic specification.
  - type: input
    id: version
    attributes:
      label: Product version/ref
      placeholder: v0.8.0 or exact commit
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Generated preset
      options:
        - bug
        - feature
        - support
        - not applicable
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe the generator result or refusal without posting sensitive information.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal sanitized JSON spec
      description: Use synthetic/public values only and remove all credentials/private details.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and scope confirmation
      options:
        - label: I removed credentials, private repository content, personal/medical data, private network details, and other sensitive information.
          required: true
        - label: I understand P-053 generates files but does not validate them through GitHub's UI or mutate a repository.
          required: true
