name: P-058 Dangerous-Script Detector
description: Report a false positive, missed dangerous construct, documentation problem, or portability issue using sanitized evidence.
title: "[P-058] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve P-058. Do **not** paste credentials, private scripts, internal paths, hostnames, IP addresses, tokens, or proprietary repository content.

  - type: dropdown
    id: report_type
    attributes:
      label: Report type
      options:
        - False positive
        - Suspected false negative / missed construct
        - Documentation
        - Portability
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: P-058 version/ref
      placeholder: v0.12.0 or exact commit
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Script/config language
      options:
        - Shell
        - PowerShell
        - Batch/CMD
        - GitHub Actions YAML
        - Other
    validations:
      required: true

  - type: textarea
    id: sanitized_reproducer
    attributes:
      label: Sanitized minimal reproducer
      description: Replace all real domains, paths, identities, tokens, and organization-specific values with inert placeholders.
      placeholder: |
        # Minimal inert example only.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and why
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, personal data, private infrastructure details, and proprietary source.
          required: true
        - label: I understand a detector finding is a review signal and not a malware verdict.
          required: true
