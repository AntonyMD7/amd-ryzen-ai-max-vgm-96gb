name: P-049 Secret Exposure Detection support
description: Report a product defect without publishing suspected secrets or private evidence.
title: "[P-049] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste any credential, token, private key, secret value, raw Gitleaks finding, private repository content, internal hostname, private URL, or sensitive CI log into this public issue.**

        If a real credential may have been exposed, rotate/revoke it with the issuing service before discussing scanner behavior publicly.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of issue is this?
      options:
        - Scanner unexpectedly passed
        - Scanner unexpectedly failed
        - False-positive concern
        - Installation or Action-loading problem
        - Documentation problem
        - Accessibility/usability problem
        - Other product defect
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: P-049 version or exact commit
      description: Example: v0.6.0 or an exact public commit SHA. Do not include credentials.
    validations:
      required: true

  - type: input
    id: runner
    attributes:
      label: Runner class
      description: P-049 v0.6.0 supports GitHub-hosted Linux x64 only.
      placeholder: github-hosted / Linux / X64
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Sanitized observed behavior
      description: Describe counts/status and workflow behavior only. Never include the secret-like value, matched line, raw finding, source path if sensitive, or private repository content.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Public-evidence safety confirmation
      options:
        - label: I did not include a credential, secret value, private key, raw scanner finding, private repository content, private URL/hostname, or other sensitive evidence in this issue.
          required: true
        - label: If this may involve a real credential, I understand that revocation/rotation is separate from filing this scanner issue.
          required: true
