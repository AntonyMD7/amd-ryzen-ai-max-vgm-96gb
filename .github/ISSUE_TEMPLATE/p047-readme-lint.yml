name: P-047 README Lint support
about: Report a reproducible problem with the DAIS README Lint Action without sharing sensitive README content
title: '[P-047] '
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve P-047. Do not paste secrets, credentials, personal records, PHI, private infrastructure details, or sensitive README content. Prefer a minimal public reproduction and the markdownlint rule identifier.
  - type: input
    id: release
    attributes:
      label: P-047 release or commit
      description: Example: v0.4.0 or an exact commit SHA
    validations:
      required: true
  - type: input
    id: runner
    attributes:
      label: Runner environment
      description: Example: GitHub-hosted Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule identifier
      description: Example: MD018. Do not paste sensitive document content.
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal public reproduction
      description: Use synthetic/public Markdown only. Explain the root input and expected vs observed result.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed secrets, credentials, personal/medical data, private infrastructure details, and sensitive README text from this report.
          required: true
        - label: I understand that P-047 PASS means Markdown style/structure acceptance only, not documentation correctness, accessibility conformance, link health, or security proof.
          required: true
