name: DAIS Universal Evidence Validate
description: Validate DAIS Universal Evidence JSON and optionally verify bounded referenced artifact SHA-256 values.
inputs:
  evidence:
    description: Path to the Universal Evidence JSON file, relative to the caller workspace.
    required: true
  artifact-root:
    description: Optional root directory containing artifacts referenced by evidence.artifacts[].name.
    required: false
    default: ''
  max-artifacts:
    description: Maximum number of declared artifacts accepted by one validation run.
    required: false
    default: '256'
  max-artifact-bytes:
    description: Maximum size in bytes of each artifact hashed by the validator.
    required: false
    default: '1073741824'
outputs:
  status:
    description: PASS or FAIL from the DAIS evidence validator.
    value: ${{ steps.validate.outputs.status }}
  schema-error-count:
    description: Number of JSON Schema validation errors.
    value: ${{ steps.validate.outputs.schema-error-count }}
  artifact-failure-count:
    description: Number of artifact validation failures.
    value: ${{ steps.validate.outputs.artifact-failure-count }}
  verified-artifact-count:
    description: Number of artifact hashes verified successfully.
    value: ${{ steps.validate.outputs.verified-artifact-count }}
  report-path:
    description: Workspace-relative path to the complete machine-readable validator report.
    value: ${{ steps.validate.outputs.report-path }}
  report-sha256:
    description: SHA-256 of the complete validator report bytes.
    value: ${{ steps.validate.outputs.report-sha256 }}
runs:
  using: composite
  steps:
    - name: Require supported immutable runtime scope
      shell: bash
      env:
        DAIS_RUNNER_OS: ${{ runner.os }}
        DAIS_RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail
        test "$DAIS_RUNNER_OS" = Linux || { echo "P-050 released runtime supports Linux only" >&2; exit 2; }
        test "$DAIS_RUNNER_ARCH" = X64 || { echo "P-050 released runtime supports x64 only" >&2; exit 2; }
        python - <<'PY'
        import platform, sys
        assert sys.version_info[:2] == (3, 12), f"P-050 released runtime requires CPython 3.12, got {sys.version}"
        assert platform.python_implementation() == "CPython"
        print("P050_RUNTIME_SCOPE=LINUX_X64_CPYTHON_3_12")
        PY

    - name: Install hash-locked validation runtime
      shell: bash
      run: |
        set -euo pipefail
        LOCK="${{ github.action_path }}/requirements-linux-x64-py312.lock"
        python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r "$LOCK"
        python - <<'PY'
        import importlib.metadata as md
        expected = {
            "jsonschema": "4.26.0",
            "attrs": "25.3.0",
            "jsonschema-specifications": "2025.9.1",
            "referencing": "0.37.0",
            "rpds-py": "0.27.1",
        }
        observed = {name: md.version(name) for name in expected}
        assert observed == expected, (observed, expected)
        print("P050_RUNTIME_VERSION_LOCK=PASS")
        PY

    - name: Validate evidence and publish bounded outputs
      id: validate
      shell: bash
      env:
        DAIS_EVIDENCE: ${{ inputs.evidence }}
        DAIS_ARTIFACT_ROOT: ${{ inputs.artifact-root }}
        DAIS_MAX_ARTIFACTS: ${{ inputs.max-artifacts }}
        DAIS_MAX_ARTIFACT_BYTES: ${{ inputs.max-artifact-bytes }}
      run: |
        set -euo pipefail
        VALIDATOR="${{ github.action_path }}/../../../scripts/evidence_validate.py"
        SCHEMA="${{ github.action_path }}/../../../schemas/universal-evidence-v0.1.schema.json"
        REPORT="${RUNNER_TEMP}/dais-evidence-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"

        args=("$DAIS_EVIDENCE" --schema "$SCHEMA" --result-file "$REPORT" --max-artifacts "$DAIS_MAX_ARTIFACTS" --max-artifact-bytes "$DAIS_MAX_ARTIFACT_BYTES")
        if [ -n "$DAIS_ARTIFACT_ROOT" ]; then
          args+=(--artifact-root "$DAIS_ARTIFACT_ROOT")
        fi

        set +e
        python "$VALIDATOR" "${args[@]}"
        rc=$?
        set -e

        python - "$REPORT" "$GITHUB_OUTPUT" "$GITHUB_WORKSPACE" <<'PY'
        import hashlib
        import json
        import sys
        from pathlib import Path

        report = Path(sys.argv[1])
        output = Path(sys.argv[2])
        workspace = Path(sys.argv[3]).resolve()
        data = json.loads(report.read_text(encoding='utf-8'))
        counts = data.get('counts', {})
        try:
            visible = str(report.resolve().relative_to(workspace))
        except ValueError:
            visible = str(report)
        digest = hashlib.sha256(report.read_bytes()).hexdigest()
        lines = {
            'status': data.get('status', 'FAIL'),
            'schema-error-count': counts.get('schema_errors', 0),
            'artifact-failure-count': counts.get('artifact_failures', 0),
            'verified-artifact-count': counts.get('verified_artifacts', 0),
            'report-path': visible,
            'report-sha256': digest,
        }
        with output.open('a', encoding='utf-8') as handle:
            for key, value in lines.items():
                handle.write(f'{key}={value}\n')

        if data.get('status') != 'PASS':
            for error in data.get('schema_errors', [])[:20]:
                message = str(error.get('message', 'schema validation failed')).replace('\n', ' ')
                path = str(error.get('path', '$')).replace('\n', ' ')
                print(f'::error title=DAIS evidence schema validation::{path}: {message}')
            for failure in data.get('artifact_failures', [])[:20]:
                name = str(failure.get('name', 'artifact')).replace('\n', ' ')
                reason = str(failure.get('reason', 'artifact validation failed')).replace('\n', ' ')
                print(f'::error title=DAIS evidence artifact validation::{name}: {reason}')
        else:
            print('::notice title=DAIS evidence validation::Universal Evidence validation passed')
        PY

        exit "$rc"
