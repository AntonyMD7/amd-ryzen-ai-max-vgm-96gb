name: DAIS Universal Evidence Validate
description: Validate a DAIS Universal Evidence v0.1 JSON record and optionally verify referenced artifact SHA-256 values.
inputs:
  evidence:
    description: Path to the Universal Evidence JSON file, relative to the caller workspace.
    required: true
  artifact-root:
    description: Optional root directory containing artifacts referenced by evidence.artifacts[].name.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install pinned JSON Schema validator
      shell: bash
      run: python -m pip install --disable-pip-version-check 'jsonschema==4.26.0'

    - name: Validate evidence
      shell: bash
      env:
        DAIS_EVIDENCE: ${{ inputs.evidence }}
        DAIS_ARTIFACT_ROOT: ${{ inputs.artifact-root }}
      run: |
        set -euo pipefail
        VALIDATOR="${{ github.action_path }}/../../../scripts/evidence_validate.py"
        SCHEMA="${{ github.action_path }}/../../../schemas/universal-evidence-v0.1.schema.json"
        if [ -n "$DAIS_ARTIFACT_ROOT" ]; then
          python "$VALIDATOR" "$DAIS_EVIDENCE" --schema "$SCHEMA" --artifact-root "$DAIS_ARTIFACT_ROOT"
        else
          python "$VALIDATOR" "$DAIS_EVIDENCE" --schema "$SCHEMA"
        fi
